<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>在线客服</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
            background: #f5f5f5;
            height: 100vh;
            height: 100dvh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }
        .chat-container {
            width: 100%;
            max-width: 420px;
            height: 100vh;
            height: 100dvh;
            background: #fff;
            display: flex;
            flex-direction: column;
        }
        .chat-header {
            background: linear-gradient(135deg, #1a6fc4 0%, #2b7de9 100%);
            color: #fff;
            padding: 12px 16px;
            display: flex;
            align-items: center;
            gap: 12px;
            flex-shrink: 0;
        }
        .back-btn {
            background: rgba(255,255,255,0.2);
            border: none;
            color: #fff;
            width: 32px;
            height: 32px;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }
        .header-logo {
            width: 36px; height: 36px;
            background: rgba(255,255,255,0.2);
            border-radius: 8px;
            display: flex; align-items: center; justify-content: center;
            font-size: 18px; overflow: hidden;
            flex-shrink: 0;
        }
        .header-logo img { width: 100%; height: 100%; object-fit: cover; }
        .header-info { flex: 1; }
        .header-info h1 { font-size: 16px; font-weight: 600; }
        .header-info p { font-size: 11px; opacity: 0.85; margin-top: 2px; }
        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            background: #f7f8fa;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .message {
            max-width: 82%;
            padding: 12px 14px;
            border-radius: 12px;
            font-size: 14px;
            line-height: 1.6;
        }
        .message.received {
            background: #fff;
            color: #333;
            align-self: flex-start;
            border-bottom-left-radius: 4px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.06);
        }
        .message.sent {
            background: linear-gradient(135deg, #2b7de9 0%, #4a90e2 100%);
            color: #fff;
            align-self: flex-end;
            border-bottom-right-radius: 4px;
        }
        .message img { max-width: 100%; border-radius: 8px; margin-bottom: 6px; display: block; }
        .message-time { font-size: 11px; opacity: 0.6; margin-top: 6px; text-align: right; }
        .system-tip {
            text-align: center;
            padding: 8px 16px;
            background: rgba(43, 125, 233, 0.08);
            border-radius: 20px;
            font-size: 12px;
            color: #2b7de9;
            align-self: center;
        }
        .quick-options {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            padding: 10px 16px;
            background: #fff;
            border-top: 1px solid #eee;
            flex-shrink: 0;
        }
        .quick-btn {
            padding: 6px 12px;
            background: #f5f7fa;
            border: 1px solid #e8e8e8;
            border-radius: 16px;
            font-size: 13px;
            color: #333;
            cursor: pointer;
        }
        .quick-btn:hover { background: #e8f0fe; color: #2b7de9; border-color: #2b7de9; }
        .quick-btn:focus { outline: 2px solid #2b7de9; outline-offset: 1px; }
        
        .chat-input {
            padding: 10px 12px;
            background: #fff;
            border-top: 1px solid #e8e8e8;
            display: flex;
            gap: 8px;
            align-items: flex-end;
            flex-shrink: 0;
        }
        .attach-btn {
            width: 36px;
            height: 36px;
            background: #f5f7fa;
            border: 1px solid #e8e8e8;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .attach-btn:hover { background: #e8f0fe; }
        .attach-btn:focus { outline: 2px solid #2b7de9; outline-offset: 1px; }
        
        .input-wrapper {
            flex: 1;
            background: #f5f7fa;
            border: 1px solid #e8e8e8;
            border-radius: 8px;
            padding: 8px 12px;
            min-height: 40px;
            max-height: 120px;
            overflow-y: auto;
        }
        #messageInput {
            width: 100%;
            border: none;
            background: transparent;
            font-size: 14px;
            outline: none;
            resize: none;
            line-height: 1.5;
            color: #333;
            min-height: 20px;
        }
        #messageInput::placeholder { color: #999; }
        
        .send-btn {
            padding: 0 14px;
            height: 36px;
            background: #2b7de9;
            border: none;
            border-radius: 8px;
            color: #fff;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            flex-shrink: 0;
        }
        .send-btn:hover { opacity: 0.9; }
        .send-btn:focus { outline: 2px solid #1a6fc4; outline-offset: 1px; }
        .send-btn:disabled { background: #ccc; cursor: not-allowed; }
        
        .image-preview { position: relative; margin-bottom: 6px; display: none; }
        .image-preview.active { display: block; }
        .image-preview img { max-width: 100%; max-height: 120px; border-radius: 6px; display: block; }
        .image-remove {
            position: absolute;
            top: -6px;
            right: -6px;
            width: 20px;
            height: 20px;
            background: rgba(0,0,0,0.6);
            border: none;
            border-radius: 50%;
            color: #fff;
            font-size: 11px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        #fileInput { display: none; }
    </style>
</head>
<body>
    <div class="chat-container">
        <div class="chat-header">
            <div class="header-logo" id="headerLogo"></div>
            <div class="header-info">
                <h1 id="headerTitle">银联客服</h1>
                <p>在线时间 08:00-22:00</p>
            </div>
        </div>

        <div class="chat-messages" id="chatMessages" role="log" aria-live="polite" aria-label="聊天消息">
            <div class="system-tip">当前客服在线，预计等待 1-2 分钟</div>
            <div class="message received">
                您好，欢迎致电银联在线客服中心，请问有什么可以帮您？
                <div class="message-time">刚刚</div>
            </div>
        </div>

        <div class="quick-options">
            <button class="quick-btn" onclick="sendQuick('交易异常')" aria-label="发送快捷消息：交易异常">交易异常</button>
            <button class="quick-btn" onclick="sendQuick('查询账单')" aria-label="发送快捷消息：查询账单">查询账单</button>
            <button class="quick-btn" onclick="sendQuick('挂失补办')" aria-label="发送快捷消息：挂失补办">挂失补办</button>
        </div>

        <div class="chat-input">
            <button class="attach-btn" onclick="document.getElementById('fileInput').click()" title="发送图片">📷</button>
            <input type="file" id="fileInput" accept="image/*" onchange="handleFileSelect(event)">
            <div class="input-wrapper">
                <div class="image-preview" id="imagePreview">
                    <img id="previewImg" src="" alt="">
                    <button class="image-remove" onclick="removeImage()">✕</button>
                </div>
                <textarea id="messageInput" placeholder="输入文字..." rows="1"></textarea>
            </div>
            <button class="send-btn" id="sendBtn" onclick="sendMessage()">发送</button>
        </div>
    </div>

    <script>
        const chatMessages = document.getElementById('chatMessages');
        const messageInput = document.getElementById('messageInput');
        const sendBtn = document.getElementById('sendBtn');
        const headerLogo = document.getElementById('headerLogo');
        const headerTitle = document.getElementById('headerTitle');
        
        let currentImage = null;
        const userId = 'user_' + Math.random().toString(36).slice(2) + '_' + Date.now();

        // 加载配置
        function loadConfig() {
            try {
                const config = JSON.parse(localStorage.getItem('chatConfig') || '{}');
                if (config.logo) headerLogo.innerHTML = `<img src="${config.logo}">`;
                if (config.title) headerTitle.textContent = config.title;
            } catch(e) { console.error('加载配置失败', e); }
        }
        loadConfig();

        // 返回首页
        function goBack() {
            window.location.href = 'customer-service.new.html';
        }

        // 输入监听 - 自动调整高度
        messageInput.addEventListener('input', function() {
            this.style.height = 'auto';
            this.style.height = Math.min(this.scrollHeight, 100) + 'px';
            sendBtn.disabled = !this.value.trim() && !currentImage;
            
            try {
                const data = JSON.stringify({ 
                    type: 'typing', 
                    text: this.value, 
                    image: currentImage, 
                    time: Date.now(),
                    userId: userId
                });
                localStorage.setItem('chatEvent', data);
            } catch(e) { console.error('存储事件失败', e); }
        });

        // 文件选择
        function handleFileSelect(event) {
            const file = event.target.files[0];
            if (!file) return;
            
            if (file.size > 5 * 1024 * 1024) {
                alert('图片大小不能超过5MB');
                return;
            }
            
            const reader = new FileReader();
            reader.onload = function(e) {
                currentImage = e.target.result;
                document.getElementById('previewImg').src = currentImage;
                document.getElementById('imagePreview').classList.add('active');
            };
            reader.onerror = function() {
                alert('图片读取失败，请重试');
            };
            reader.readAsDataURL(file);
        }

        function removeImage() {
            currentImage = null;
            document.getElementById('imagePreview').classList.remove('active');
            document.getElementById('fileInput').value = '';
        }

        function sendQuick(text) {
            messageInput.value = text;
            sendMessage();
        }

        function sendMessage() {
            const text = messageInput.value.trim();
            const image = currentImage;
            if (!text && !image) return;

            addMessage(text, 'sent', image);
            messageInput.value = '';
            messageInput.style.height = 'auto';
            removeImage();
            sendBtn.disabled = true;

            try {
                const data = JSON.stringify({ 
                    type: 'sent', 
                    text, 
                    image,
                    time: Date.now(),
                    userId: userId
                });
                localStorage.setItem('chatEvent', data);
            } catch(e) { 
                console.error('发送消息失败', e);
                alert('消息发送失败，请重试');
            }

            setTimeout(() => {
                addMessage('感谢您的咨询，客服人员会尽快与您联系。', 'received');
            }, 1000);
        }

        function addMessage(text, type, image = null) {
            const msg = document.createElement('div');
            msg.className = `message ${type}`;
            const now = new Date();
            const time = `${now.getHours().toString().padStart(2,'0')}:${now.getMinutes().toString().padStart(2,'0')}`;
            
            let content = '';
            if (image) content += `<img src="${image}" alt="图片">`;
            if (text) content += escapeHtml(text).replace(/\n/g, '<br>');
            
            msg.innerHTML = `${content}<div class="message-time">${time}</div>`;
            chatMessages.appendChild(msg);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        function escapeHtml(text) {
            const d = document.createElement('div');
            d.textContent = text;
            return d.innerHTML;
        }

        messageInput.addEventListener('keydown', function(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });

        sendBtn.disabled = true;
    </script>
</body>
</html>
