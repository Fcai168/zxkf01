<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>客服后台管理</title>
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <script src="supabase.js" onerror="var s=document.createElement('script');s.src='https://unpkg.com/@supabase/supabase-js@2';document.head.appendChild(s);"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/umd/supabase.js" onerror="console.warn('CDN2失败');"></script>
<script src="https://unpkg.com/@supabase/supabase-js@2/dist/umd/supabase.js" onerror="console.warn('CDN3失败');"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
            background: #f0f2f5;
            height: 100vh;
            height: 100dvh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* 登录遮罩 */
        .login-overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: linear-gradient(135deg, #0f4c8c 0%, #1a6fc4 50%, #2b7de9 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            z-index: 9999;
            overflow: hidden;
        }
        .login-overlay::before {
            content: "";
            position: absolute;
            top: -80px; right: -60px;
            width: 260px; height: 260px;
            background: radial-gradient(circle, rgba(255,255,255,0.14) 0%, transparent 70%);
            border-radius: 50%;
        }
        .login-overlay::after {
            content: "";
            position: absolute;
            bottom: -100px; left: -60px;
            width: 300px; height: 300px;
            background: radial-gradient(circle, rgba(255,255,255,0.10) 0%, transparent 70%);
            border-radius: 50%;
        }
        /* 登录框固定在屏幕上方 12% 处，键盘弹起也不会挡住 */
        .login-box {
            position: relative;
            z-index: 1;
            margin-top: 12vh;
            background: rgba(255,255,255,0.97);
            backdrop-filter: blur(10px);
            padding: 28px 22px;
            border-radius: 20px;
            width: 88%;
            max-width: 340px;
            box-shadow: 0 16px 48px rgba(10,45,90,0.35);
            border: 1px solid rgba(255,255,255,0.6);
        }
        .login-box h2 {
            font-size: 20px;
            margin-bottom: 6px;
            text-align: center;
            color: #1a1a1a;
        }
        .login-box .subtitle {
            font-size: 12px;
            color: #8a94a6;
            text-align: center;
            margin-bottom: 20px;
        }
        .login-box input {
            width: 100%;
            padding: 13px 14px;
            border: 1px solid #e0e6ee;
            border-radius: 12px;
            font-size: 15px;
            margin-bottom: 14px;
            transition: all 0.2s;
            background: #fafbfd;
        }
        .login-box input:focus {
            outline: none;
            border-color: #2b7de9;
            background: #fff;
            box-shadow: 0 0 0 3px rgba(43,125,233,0.12);
        }
        .login-box button {
            width: 100%;
            padding: 13px;
            background: linear-gradient(135deg, #1a6fc4 0%, #2b7de9 100%);
            color: #fff;
            border: none;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 600;
            letter-spacing: 2px;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 4px 14px rgba(43,125,233,0.35);
        }
        .login-box button:hover { opacity: 0.92; }
        .login-box button:active { transform: scale(0.98); }
        .login-hint {
            text-align: center;
            margin-top: 14px;
            font-size: 11px;
            color: #8a94a6;
        }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            75% { transform: translateX(10px); }
        }

        /* 顶部导航 */
        .top-bar {
            position: relative;
            overflow: hidden;
            background: linear-gradient(135deg, #135a9e 0%, #1a6fc4 45%, #2b7de9 100%);
            color: #fff;
            padding: 12px 14px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-shrink: 0;
            box-shadow: 0 2px 12px rgba(26,111,196,0.28);
            z-index: 2;
        }
        .top-bar::before {
            content: "";
            position: absolute;
            top: -30px; right: 20px;
            width: 100px; height: 100px;
            background: radial-gradient(circle, rgba(255,255,255,0.14) 0%, transparent 70%);
            border-radius: 50%;
        }
        .top-bar h1 { 
            font-size: 16px; 
            font-weight: 600;
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
            gap: 7px;
            position: relative; z-index: 1;
        }
        .top-actions { display: flex; gap: 6px; position: relative; z-index: 1; }
        .top-btn {
            background: rgba(255,255,255,0.18);
            border: none;
            color: #fff;
            padding: 6px 11px;
            border-radius: 7px;
            font-size: 12px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .top-btn:hover { background: rgba(255,255,255,0.28); }
        .top-btn:active { transform: scale(0.96); }

        /* 主内容区 */
        .main-wrapper {
            flex: 1;
            display: flex;
            overflow: hidden;
        }

        /* 用户侧边栏 */
        .user-sidebar {
            width: 100px;
            background: #fff;
            border-right: 1px solid #e5e9f0;
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
        }
        .user-tabs { 
            display: flex; 
            border-bottom: 1px solid #e5e9f0;
            background: #fafbfc;
        }
        .user-tab {
            flex: 1;
            padding: 8px 0;
            text-align: center;
            font-size: 11px;
            color: #666;
            cursor: pointer;
            border-bottom: 2px solid transparent;
            transition: all 0.2s;
        }
        .user-tab.active { 
            color: #2b7de9; 
            border-bottom-color: #2b7de9;
            background: #fff;
        }
        .user-list { 
            flex: 1; 
            overflow-y: auto;
        }
        .user-item {
            position: relative;
            padding: 10px 4px;
            border-bottom: 1px solid #f3f5f8;
            border-left: 3px solid transparent;
            cursor: pointer;
            text-align: center;
            transition: background 0.15s;
        }
        .user-item:hover { background: #f8fafc; }
        .user-item.active { 
            background: #f0f7ff; 
            border-left-color: #2b7de9;
        }
        .user-avatar {
            position: relative;
            width: 34px;
            height: 34px;
            background: linear-gradient(135deg, #e8f0fe 0%, #d4e4ff 100%);
            border-radius: 50%;
            margin: 0 auto 5px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 15px;
            box-shadow: 0 2px 6px rgba(43,125,233,0.15);
        }
        .user-avatar .status-dot {
            position: absolute;
            bottom: -1px;
            right: -1px;
            width: 10px;
            height: 10px;
            background: #9aa5b5;
            border-radius: 50%;
            border: 2px solid #fff;
        }
        .user-avatar .status-dot.online { background: #22c55e; }
        .user-name { 
            font-size: 10px; 
            color: #333; 
            font-weight: 500;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            padding: 0 2px;
        }
        .user-status { 
            font-size: 9px; 
            color: #8a94a6;
            margin-top: 2px;
        }
        .user-status.online { color: #16a34a; font-weight: 500; }

        /* 聊天区域 */
        .chat-area { 
            flex: 1; 
            display: flex; 
            flex-direction: column; 
            background: #f0f2f5;
            overflow: hidden;
        }
        .chat-header {
            background: #fff;
            padding: 10px 12px;
            border-bottom: 1px solid #e5e9f0;
            display: flex; 
            align-items: center; 
            gap: 10px;
            flex-shrink: 0;
            box-shadow: 0 1px 4px rgba(30,60,100,0.05);
        }
        .chat-header .avatar { 
            width: 34px; 
            height: 34px; 
            background: linear-gradient(135deg, #e8f0fe 0%, #d4e4ff 100%);
            border-radius: 50%; 
            display: flex; 
            align-items: center; 
            justify-content: center;
            font-size: 15px;
            box-shadow: 0 2px 6px rgba(43,125,233,0.15);
        }
        .chat-header-info h3 { 
            font-size: 13px; 
            color: #1a1a1a;
            font-weight: 500;
        }
        .chat-header-info p { 
            font-size: 10px; 
            color: #8a94a6; 
            margin-top: 1px;
        }

        .chat-messages { 
            flex: 1; 
            overflow-y: auto; 
            padding: 12px 10px;
            display: flex; 
            flex-direction: column; 
            gap: 8px;
            background: linear-gradient(180deg, #f3f6fb 0%, #eef1f6 100%);
            scrollbar-width: thin;
            scrollbar-color: #c5d2e0 transparent;
        }
        .chat-messages::-webkit-scrollbar { width: 4px; }
        .chat-messages::-webkit-scrollbar-thumb { background: #c5d2e0; border-radius: 4px; }
        .msg { 
            max-width: 85%; 
            padding: 8px 11px;
            border-radius: 12px; 
            font-size: 13px; 
            line-height: 1.5;
            word-break: break-word;
            animation: msgIn 0.2s ease;
        }
        @keyframes msgIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .msg.user { 
            background: #fff; 
            color: #333;
            align-self: flex-start; 
            border-bottom-left-radius: 4px; 
            box-shadow: 0 1px 4px rgba(30,60,100,0.08);
        }
        .msg.agent { 
            background: linear-gradient(135deg, #1a6fc4 0%, #2b7de9 100%);
            color: #fff; 
            align-self: flex-end; 
            border-bottom-right-radius: 4px;
            box-shadow: 0 2px 6px rgba(43,125,233,0.22);
        }
        .msg img { 
            max-width: 100%; 
            border-radius: 8px; 
            margin-bottom: 4px; 
            display: block;
        }
        .msg-time { 
            font-size: 10px; 
            opacity: 0.75; 
            margin-top: 4px; 
            text-align: right;
        }

        /* 逐字同步指示器 */
        .typing-indicator {
            font-size: 11px;
            color: #8a94a6;
            padding: 4px 10px;
            min-height: 20px;
            background: #fff;
            border-top: 1px solid #f0f0f0;
            display: flex;
            align-items: center;
            gap: 4px;
            flex-shrink: 0;
        }
        .typing-indicator.active {
            color: #2b7de9;
            background: #f8fbff;
        }
        .typing-indicator .cursor {
            display: inline-block;
            width: 2px;
            height: 10px;
            background: #2b7de9;
            animation: blink 1s infinite;
            vertical-align: middle;
        }
        @keyframes blink { 0%,100%{opacity:1}50%{opacity:0} }

        /* 输入区域 */
        .chat-input {
            padding: 8px 10px;
            padding-bottom: calc(8px + env(safe-area-inset-bottom));
            background: #fff;
            border-top: 1px solid #e5e9f0;
            display: flex; 
            gap: 6px; 
            align-items: flex-end;
            flex-shrink: 0;
        }
        .input-tools { display: flex; gap: 4px; }
        .tool-btn {
            width: 44px; 
            height: 44px;
            background: #f5f7fa; 
            border: 1px solid #e5e9f0;
            border-radius: 6px; 
            font-size: 14px; 
            color: #5a6b7f;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .input-box {
            flex: 1; 
            background: #f5f7fa;
            border: 1px solid #e5e9f0;
            border-radius: 10px; 
            padding: 7px 10px;
            min-height: 32px; 
            max-height: 100px; 
            overflow-y: auto;
            transition: all 0.2s;
        }
        .input-box:focus-within {
            border-color: #2b7de9;
            background: #fff;
            box-shadow: 0 0 0 2px rgba(43,125,233,0.10);
        }
        #agentInput {
            width: 100%; 
            border: none; 
            background: transparent;
            font-size: 13px; 
            outline: none; 
            resize: none;
            line-height: 1.4; 
            color: #333;
            font-family: inherit;
        }
        #agentInput::placeholder { color: #b0b8c4; }
        .send-btn {
            width: 52px; 
            height: 44px;
            background: linear-gradient(135deg, #1a6fc4 0%, #2b7de9 100%);
            border: none; 
            border-radius: 12px;
            color: #fff;
            font-size: 13px; 
            font-weight: 600;
            cursor: pointer;
            flex-shrink: 0;
            box-shadow: 0 2px 8px rgba(43,125,233,0.3);
            transition: all 0.2s ease;
            -webkit-tap-highlight-color: transparent;
        }
        .send-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(43,125,233,0.4);
        }
        .send-btn:active:not(:disabled) {
            transform: translateY(0) scale(0.98);
            background: linear-gradient(135deg, #155a9e 0%, #2468c4 100%);
        }
        .send-btn:focus-visible {
            outline: 2px solid #1a6fc4;
            outline-offset: 2px;
        }
        .send-btn:disabled { 
            background: #c9d4e2; 
            box-shadow: none;
            cursor: not-allowed;
        }
            cursor: not-allowed;
        }
        
        .img-preview { position: relative; margin-bottom: 4px; display: none; }
        .img-preview.active { display: block; }
        .img-preview img { max-width: 100%; max-height: 80px; border-radius: 4px; }
        .img-remove {
            position: absolute; 
            top: -4px; 
            right: -4px;
            width: 16px; 
            height: 16px;
            background: rgba(0,0,0,0.6); 
            border: none;
            border-radius: 50%; 
            color: #fff; 
            font-size: 9px; 
            cursor: pointer;
        }
        #agentFileInput { display: none; }

        .empty-tip { 
            text-align: center; 
            padding: 40px 16px; 
            color: #a8b2c0; 
            font-size: 12px;
            line-height: 1.8;
        }

        /* ===== 电脑版响应式（≥768px）===== */
        @media (min-width: 768px) {
            .user-sidebar {
                width: 260px;
                border-right: 1px solid #e5e9f0;
            }
            .user-tabs { padding: 4px; }
            .user-tab {
                padding: 9px 0;
                font-size: 13px;
                border-radius: 8px;
                margin: 0 2px;
            }
            .user-tab.active {
                background: linear-gradient(135deg, #1a6fc4 0%, #2b7de9 100%);
                color: #fff;
                border-bottom-color: transparent;
                box-shadow: 0 2px 8px rgba(43,125,233,0.3);
            }
            .user-item {
                display: flex;
                align-items: center;
                gap: 10px;
                text-align: left;
                padding: 10px 12px;
            }
            .user-avatar {
                width: 40px;
                height: 40px;
                margin: 0;
                flex-shrink: 0;
                font-size: 18px;
            }
            .user-item .user-avatar { order: 0; }
            .user-meta {
                order: 1;
                flex: 1;
                min-width: 0;
                text-align: left;
            }
            .user-name {
                font-size: 13px;
            }
            .user-status {
                margin-top: 2px;
                font-size: 10px;
            }
            .chat-header { padding: 12px 16px; }
            .chat-header .avatar { width: 40px; height: 40px; font-size: 18px; }
            .chat-header-info h3 { font-size: 15px; }
            .msg { font-size: 14px; padding: 10px 13px; }
            .chat-input { padding: 10px 14px; }
            .tool-btn { width: 36px; height: 36px; }
            .send-btn { width: 64px; height: 36px; font-size: 13px; }
            .top-bar h1 { font-size: 17px; }
            /* 登录页电脑版居中 */
            .login-overlay { justify-content: center; }
            .login-box { margin-top: 0; max-width: 380px; }
        }

        /* 设置页面 */
        .settings-page { 
            flex: 1; 
            overflow-y: auto; 
            padding: 12px;
        }
        .setting-card {
            background: #fff;
            border-radius: 10px;
            padding: 14px;
            margin-bottom: 10px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.06);
        }
        .setting-card-title { 
            font-size: 12px; 
            color: #666; 
            margin-bottom: 10px;
            font-weight: 500;
        }
        .setting-row { 
            display: flex; 
            align-items: center; 
            gap: 8px; 
            margin-bottom: 10px;
        }
        .setting-label { 
            font-size: 12px; 
            color: #666; 
            min-width: 40px;
        }
        .setting-input {
            flex: 1; 
            padding: 8px 10px;
            border: 1px solid #e5e9f0; 
            border-radius: 6px;
            font-size: 13px;
        }
        .setting-input:focus { 
            outline: none; 
            border-color: #2b7de9; 
        }
        .save-btn {
            padding: 9px 16px; 
            background: linear-gradient(135deg, #1a6fc4 0%, #2b7de9 100%);
            color: #fff;
            border: none; 
            border-radius: 8px; 
            font-size: 12px; 
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(43,125,233,0.3);
            transition: all 0.2s;
        }
        .save-btn:active { transform: scale(0.96); }
        .logo-box { 
            display: flex; 
            align-items: center; 
            gap: 12px;
        }
        .logo-preview {
            width: 48px; 
            height: 48px;
            background: #f5f7fa; 
            border-radius: 8px;
            display: flex; 
            align-items: center; 
            justify-content: center;
            font-size: 18px; 
            color: #ccc; 
            overflow: hidden; 
            border: 2px dashed #e0e0e0;
        }
        .logo-preview img { 
            width: 100%; 
            height: 100%; 
            object-fit: cover; 
        }
        .upload-btn {
            padding: 8px 12px; 
            background: #f5f7fa; 
            color: #333;
            border: 1px solid #e5e9f0;
            border-radius: 6px; 
            font-size: 11px; 
            cursor: pointer;
            display: inline-block;
        }
        .upload-btn:hover { background: #e8f0fe; color: #2b7de9; border-color: #2b7de9; }
        .nav-link {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            padding: 10px;
            color: #2b7de9; 
            text-decoration: none; 
            font-size: 13px;
            background: #fff; 
            border-radius: 8px; 
            margin-top: 8px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.06);
        }
        .nav-link:hover { background: #f8fafc; }

        /* 响应式 */
        @media (max-width: 480px) {
            .user-sidebar { width: 80px; }
            .user-avatar { width: 28px; height: 28px; font-size: 12px; }
            .user-name { font-size: 11px; }
            .user-status { font-size: 10px; }
        }
    </style>
</head>
<body>
    <!-- 登录遮罩 -->
    <div class="login-overlay" id="loginOverlay">
        <div class="login-box">
            <h2>🛠️ 客服后台</h2>
            <input type="password" id="passwordInput" placeholder="请输入管理密码" autocomplete="current-password">
            <button id="loginBtn" onclick="loginClick(event)">登录</button>
            <p id="diagBox" style="font-size:13px;color:#1a6fc4;margin-top:10px;text-align:center;word-break:break-all;min-height:18px;"></p>
            <p style="font-size:10px;color:#ccc;text-align:center;">v8</p>
        </div>
    </div>

    <!-- 主界面 -->
    <div id="mainInterface" style="display:none;flex-direction:column;height:100%;">
        <!-- 顶部导航 -->
        <div class="top-bar">
            <h1>🛠️ 客服后台</h1>
            <div class="top-actions">
                <button class="top-btn" onclick="window.open('chat-fullscreen.html','_blank')">📱 预览</button>
                <button class="top-btn" onclick="switchToSettings()">⚙️ 设置</button>
                <button class="top-btn" onclick="logout()">退出</button>
            </div>
        </div>

        <!-- 主内容 -->
        <div class="main-wrapper">
            <!-- 用户列表 -->
            <div class="user-sidebar">
                <div class="user-tabs">
                    <div class="user-tab active" onclick="switchUserTab('online', this)">办理中</div>
                    <div class="user-tab" onclick="switchUserTab('history', this)">历史</div>
                </div>
                <div class="user-list" id="userList"></div>
            </div>

            <!-- 聊天区域 -->
            <div class="chat-area">
                <div class="chat-header">
                    <div class="avatar">👤</div>
                    <div class="chat-header-info">
                        <h3 id="chatName">选择用户</h3>
                        <p id="chatStatus">-</p>
                    </div>
                </div>
                <div class="chat-messages" id="chatMessages">
                    <div class="empty-tip">请在左侧选择用户</div>
                </div>
                <div class="typing-indicator" id="typingIndicator">等待用户输入...</div>
                <div class="chat-input">
                    <div class="input-tools">
                        <button class="tool-btn" aria-label="发送图片" onclick="document.getElementById('agentFileInput').click()"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="4"></rect><circle cx="8.5" cy="8.5" r="1.8"></circle><path d="M21 15l-5-5L5 21"></path></svg></button>
                        <input type="file" id="agentFileInput" accept="image/*" onchange="handleAgentFile(event)">
                    </div>
                    <div class="input-box">
                        <div class="img-preview" id="agentImgPreview">
                            <img id="agentPreviewImg" src="" alt="">
                            <button class="img-remove" onclick="removeAgentImg()">✕</button>
                        </div>
                        <textarea id="agentInput" placeholder="输入回复..." rows="1"></textarea>
                    </div>
                    <button class="send-btn" id="agentSendBtn" onclick="agentSend()">发送</button>
                </div>
            </div>
        </div>

        <!-- 设置页面 -->
        <div id="settings" class="main-wrapper" style="display:none;">
            <div class="settings-page">
                <div class="setting-card">
                    <div class="setting-card-title">🖼️ Logo设置</div>
                    <div class="logo-box">
                        <div class="logo-preview" id="logoPreview">☰</div>
                        <label class="upload-btn">
                            选择图片
                            <input type="file" id="logoInput" accept="image/*" style="display:none" onchange="handleLogo(event)">
                        </label>
                        <button class="save-btn" style="margin-left:8px" onclick="saveLogo()">保存Logo</button>
                    </div>
                </div>
                <div class="setting-card">
                    <div class="setting-card-title">📝 名称设置</div>
                    <div class="setting-row">
                        <span class="setting-label">客服名</span>
                        <input type="text" class="setting-input" id="nameInput" placeholder="输入名称" value="银联客服">
                        <button class="save-btn" onclick="saveSettings()">保存</button>
                    </div>
                </div>
                <a href="chat-fullscreen.html" class="nav-link" target="_blank">📱 预览客服页面</a>
                <a href="customer-service.new.html" class="nav-link">🏠 返回首页</a>
            </div>
        </div>
    </div>

    <script>
        const ADMIN_PASSWORD = 'admin123';

        // ===== 诊断灯：把出错信息直接显示在页面上 =====
        function diag(msg) {
            try {
                var d = document.getElementById('diagBox');
                if (d) d.textContent = msg;
                console.log('[DIAG]', msg);
            } catch(e) {}
        }
        window.addEventListener('error', function(e) {
            diag('⚠️ JS出错: ' + e.message + ' @行' + e.lineno);
        });
        window.addEventListener('unhandledrejection', function(e) {
            diag('⚠️ Promise拒绝: ' + (e.reason && e.reason.message ? e.reason.message : e.reason));
        });
        diag('✅ v6加载正常，脚本执行中...');

        function loginClick(ev) {
            try {
                diag('👆 点到了登录按钮');
                checkPassword();
            } catch(e) {
                diag('❌ 登录出错: ' + e.message);
            }
        }

        function checkPassword() {
            const input = document.getElementById('passwordInput');
            const val = (input ? input.value : '').trim();
            if (!val) {
                diag('⚠️ 请先输入密码');
                if (input) input.focus();
                return;
            }
            if (val === ADMIN_PASSWORD) {
                // 先切页面，再存状态、再加载数据——任何一步出错页面都已切换
                document.getElementById('loginOverlay').style.display = 'none';
                document.getElementById('mainInterface').style.display = 'flex';
                try { sessionStorage.setItem('adminAuthenticated', 'true'); } catch(e) {}
                diag('✅ 登录成功，正在加载...');
                // 显示成功提示
                const toast = document.createElement('div');
                toast.textContent = '✅ 登录成功';
                toast.style.cssText = 'position:fixed;top:20px;left:50%;transform:translateX(-50%);background:#52c41a;color:#fff;padding:10px 24px;border-radius:20px;font-size:14px;z-index:99999;box-shadow:0 4px 12px rgba(0,0,0,.2);';
                document.body.appendChild(toast);
                setTimeout(() => toast.remove(), 2000);
                setTimeout(function() {
                    try { initApp(); } catch(e) { console.error('initApp', e); }
                }, 100);
            } else {
                diag('❌ 密码错误，请重试');
                // 抖动效果提示错误
                const box = document.querySelector('.login-box');
                if (box) {
                    box.style.animation = 'shake 0.5s';
                    setTimeout(() => box.style.animation = '', 500);
                }
            }
        }

        // 登录成功提示（3秒后消失，让用户明确知道按钮有反应）
        function showLoginToast(msg) {
            const t = document.createElement('div');
            t.textContent = msg;
            t.style.cssText = 'position:fixed;top:16px;left:50%;transform:translateX(-50%);z-index:99999;background:#1a6fc4;color:#fff;padding:10px 20px;border-radius:20px;font-size:14px;box-shadow:0 4px 12px rgba(0,0,0,.25);';
            document.body.appendChild(t);
            setTimeout(() => t.remove(), 3000);
        }
        
        document.getElementById('passwordInput').addEventListener('keydown', function(e) {
            if (e.key === 'Enter') checkPassword();
        });

        // ===== Supabase 数据层（跨设备同步）=====
        const SUPABASE_URL = 'https://qafwjrfozumfzhrbtuue.supabase.co';
        // 后台专用: service_role 全权限key(RLS开启后此key不受限,可读全部/发客服消息/改配置)
        // 前台chat-v2.html仍用低权限anon key,勿互换
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFhZndqcmZvenVtZnpocmJ0dXVlIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTc4NTk0OTQ2NCwiZXhwIjoyMTAxNTI1NDY0fQ.r5Qv_qmutC-a2jSINBYLYSUyukeJEvf-p2ZggY4fJkA';
        let sb;
        try { sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY); }
        catch(e) { console.error('Supabase初始化失败', e); }

        let pendingLogo = null;

        function formatTime(ts) {
            if (!ts) return '';
            return new Date(ts).toLocaleTimeString('zh-CN', {hour:'2-digit', minute:'2-digit'});
        }

        function compressImage(dataUrl, maxW, quality) {
            return new Promise(resolve => {
                const img = new Image();
                img.onload = () => {
                    try {
                        const scale = Math.min(1, maxW / img.width);
                        const c = document.createElement('canvas');
                        c.width = Math.round(img.width * scale);
                        c.height = Math.round(img.height * scale);
                        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
                        resolve(c.toDataURL('image/jpeg', quality));
                    } catch (e) {
                        console.warn('图片压缩失败:', e);
                        resolve(null);
                    }
                };
                img.onerror = () => resolve(null); // 加载失败拒绝入库
                img.src = dataUrl;
            });
        }

        function initApp() {
            if (!sessionStorage.getItem('adminAuthenticated')) {
                document.getElementById('loginOverlay').style.display = 'flex';
                document.getElementById('mainInterface').style.display = 'none';
                return;
            }
            document.getElementById('loginOverlay').style.display = 'none';
            document.getElementById('mainInterface').style.display = 'flex';
            loadConfig();
            renderUserList();
            startListening();
        }

        function logout() {
            sessionStorage.removeItem('adminAuthenticated');
            window.location.reload();
        }

        let users = [];
        let currentUser = null;
        let agentImage = null;
        let currentTab = 'online';

        function switchMain(tab) {
            if (tab === 'settings') {
                document.querySelector('.main-wrapper').style.display = 'none';
                document.getElementById('settings').style.display = 'flex';
            } else {
                document.querySelector('.main-wrapper').style.display = 'flex';
                document.getElementById('settings').style.display = 'none';
            }
        }

        function switchToSettings() {
            switchMain('settings');
        }

        function switchUserTab(type, el) {
            document.querySelectorAll('.user-tab').forEach(t => t.classList.remove('active'));
            el.classList.add('active');
            currentTab = type;
            renderUserList();
        }

        async function renderUserList() {
            const list = document.getElementById('userList');
            if (!sb) { list.innerHTML = '<div class="empty-tip">数据库连接失败</div>'; return; }
            try {
                // 拉取全部消息，按访客分组
                const { data: msgs, error } = await sb.from('messages').select('*').order('created_at', {ascending: true});
                if (error) throw error;
                const groups = {};
                (msgs || []).forEach(m => {
                    if (!groups[m.visitor_id]) groups[m.visitor_id] = {id: m.visitor_id, last: 0, total: 0, unread: 0};
                    groups[m.visitor_id].total++;
                    const t = new Date(m.created_at).getTime();
                    if (t > groups[m.visitor_id].last) groups[m.visitor_id].last = t;
                    if (m.from_role === 'visitor' && m.status !== 'read') groups[m.visitor_id].unread++;
                });
                const now = Date.now();
                const ONLINE_MS = 30 * 60 * 1000; // 30分钟内有消息视为在线
                users = Object.values(groups)
                    .map(g => ({...g, status: now - g.last < ONLINE_MS ? 'online' : 'offline', name: '访客 ' + g.id.slice(-4).toUpperCase()}))
                    .sort((a, b) => b.last - a.last);
                
                const filtered = currentTab === 'online' ? users.filter(u => u.status === 'online') : users;
                if (filtered.length === 0) {
                    list.innerHTML = '<div class="empty-tip"><div style="font-size:26px;margin-bottom:8px;opacity:0.5">📭</div>暂无用户<br><span style="font-size:10px;opacity:0.7">有新咨询时会自动出现在这里</span></div>';
                    return;
                }
                list.innerHTML = filtered.map(u => `
                    <div class="user-item ${currentUser?.id === u.id ? 'active' : ''}" 
                         onclick="selectUser('${escapeHtml(u.id)}')" 
                         role="button" 
                         tabindex="0" 
                         aria-label="选择用户 ${escapeHtml(u.name)}">
                        <div class="user-avatar">👤<span class="status-dot ${u.status === 'online' ? 'online' : ''}"></span></div>
                        <div class="user-meta">
                            <div class="user-name">${escapeHtml(u.name)}</div>
                            <div class="user-status ${u.status}">${u.status === 'online' ? '在线' : '离线'}</div>
                        </div>
                    </div>
                `).join('');
            } catch(e) {
                console.error('渲染用户列表失败', e);
                list.innerHTML = '<div class="empty-tip">加载用户失败，请刷新</div>';
            }
        }

        // agentChannel已改为轮询方式
        function msgHtml(m) {
            const cls = m.from_role === 'agent' ? 'agent' : 'user';
            const pic = m.type === 'image' && m.file ? `<img src="${escapeHtml(m.file)}" alt="图片">` : '';
            const txt = m.type === 'text' && m.content ? escapeHtml(m.content).replace(/\n/g, '<br>') : '';
            return `<div class="msg ${cls}">${pic}${txt}<div class="msg-time">${escapeHtml(formatTime(m.created_at))}</div></div>`;
        }

        async function selectUser(userId) {
            currentUser = users.find(u => u.id === userId);
            if (!currentUser) return;
            document.getElementById('chatName').textContent = currentUser.name;
            document.getElementById('chatStatus').textContent = currentUser.status === 'online' ? '在线' : '离线';
            renderUserList();
            await renderChat();
            
            // 立即查询一次打字状态
            checkTypingStatus(userId);
            
            // 使用轮询替代Realtime订阅（避免端点404问题）
            if (window.messagePollTimers) {
                clearInterval(window.messagePollTimers[userId]);
            }
            window.messagePollTimers = window.messagePollTimers || {};
            
            window.messagePollTimers[userId] = setInterval(async () => {
                try {
                    const { data } = await sb
                        .from('messages')
                        .select('*')
                        .eq('visitor_id', userId)
                        .order('created_at', {ascending: false})
                        .limit(10);
                    
                    if (!data || data.length === 0) return;
                    
                    // 更新未读数
                    const visitorMsgs = data.filter(m => m.from_role === 'visitor' && m.status !== 'read');
                    const g = users.find(u => u.id === userId);
                    if (g) g.unread = visitorMsgs.length;
                    
                    // 如果当前选中的是这个用户，刷新聊天
                    if (currentUser && currentUser.id === userId) {
                        renderChat();
                    }
                    
                    renderUserList();
                } catch(e) {
                    console.warn('检查新消息失败:', e);
                }
            }, 2000);
        }
        
        // 独立的打字状态查询函数
        function checkTypingStatus(userId) {
            sb.from('typing_status')
                .select('text, created_at')
                .eq('visitor_id', userId)
                .gte('created_at', new Date(Date.now() - 60000).toISOString())
                .order('created_at', {ascending: false})
                .limit(1)
                .then(({ data }) => updateTypingIndicator(userId, data))
                .catch(e => console.warn('打字状态查询失败:', e));
        }

        async function renderChat() {
            const container = document.getElementById('chatMessages');
            if (!currentUser || !sb) { container.innerHTML = '<div class="empty-tip">暂无消息</div>'; return; }
            try {
                const { data: msgs, error } = await sb
                    .from('messages').select('*').eq('visitor_id', currentUser.id).order('created_at', {ascending: true});
                if (error) throw error;
                container.innerHTML = (msgs || []).length
                    ? msgs.map(msgHtml).join('')
                    : '<div class="empty-tip">暂无消息</div>';
                // 标记访客消息为已读
                const unread = (msgs || []).filter(m => m.from_role === 'visitor' && m.status !== 'read').map(m => m.id);
                if (unread.length) await sb.from('messages').update({status: 'read'}).in('id', unread);
                container.scrollTop = container.scrollHeight;
            } catch(e) {
                console.error('渲染聊天失败', e);
                container.innerHTML = '<div class="empty-tip">加载消息失败，请刷新</div>';
            }
        }

        
        // 更新打字状态指示器
        function updateTypingIndicator(userId, data) {
            const indicator = document.getElementById('typingIndicator');
            if (!indicator) return;
            
            // 只更新当前选中用户的打字状态
            if (!currentUser || currentUser.id !== userId) return;
            
            if (data && data.length > 0) {
                indicator.textContent = '访客正在输入: ' + escapeHtml(data[0].text);
                indicator.style.display = 'block';
            } else {
                indicator.style.display = 'none';
            }
        }

        let typingCheckTimer = null;
        let userListTimer = null;
        
        function startListening() {
            // 清理旧定时器
            if (typingCheckTimer) clearInterval(typingCheckTimer);
            if (userListTimer) clearInterval(userListTimer);
            
            // 每2秒检查一次打字状态（查询最近60秒，避免时序问题）
            typingCheckTimer = setInterval(() => {
                if (!currentUser) return;
                sb.from('typing_status')
                    .select('text, created_at')
                    .eq('visitor_id', currentUser.id)
                    .gte('created_at', new Date(Date.now() - 60000).toISOString())
                    .order('created_at', {ascending: false})
                    .limit(1)
                    .then(({ data }) => updateTypingIndicator(currentUser.id, data))
                    .catch(e => console.warn('打字状态检查失败:', e));
            }, 2000);
            
            // 每3秒刷新用户列表（发现新访客）；选中访客的消息走 Supabase 实时推送
            renderUserList();
            userListTimer = setInterval(renderUserList, 3000);
            
            document.addEventListener('visibilitychange', () => {
                if (document.visibilityState === 'visible') renderUserList();
            });
        }

        function agentSend() {
            const text = document.getElementById('agentInput').value.trim();
            if (!text && !agentImage) return;
            if (!currentUser) { alert('请先选择用户'); return; }
            if (!sb) { alert('数据库连接失败'); return; }

            const btn = document.getElementById('agentSendBtn');
            btn.disabled = true;
            doAgentSend(text, btn);
        }

        async function doAgentSend(text, btn) {
            try {
                let file = agentImage;
                // 选图时已压缩，直接使用
                const msgId = 'm-' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
                const { error } = await sb.from('messages').insert({
                    id: msgId,
                    visitor_id: currentUser.id,
                    from_role: 'agent',
                    type: file ? 'image' : 'text',
                    content: text || null,
                    file: file || null,
                    status: 'sent',
                    created_at: new Date().toISOString()
                });
                if (error) throw error;
                document.getElementById('agentInput').value = '';
                removeAgentImg();
                await renderChat();
                renderUserList();
            } catch(e) {
                console.error('发送失败', e);
                alert('发送失败，请重试');
            } finally {
                btn.disabled = false;
            }
        }

        async function handleAgentFile(e) {
            const file = e.target.files[0];
            if (!file) return;
            
            if (file.size > 5 * 1024 * 1024) {
                alert('图片大小不能超过5MB');
                return;
            }
            
            const reader = new FileReader();
            reader.onload = async function(ev) {
                const dataUrl = ev.target.result;
                // 立即压缩图片
                const compressed = await compressImage(dataUrl, 900, 0.7);
                if (!compressed) {
                    alert('图片处理失败，请换一张试试');
                    return;
                }
                agentImage = compressed;
                document.getElementById('agentPreviewImg').src = compressed;
                document.getElementById('agentImgPreview').classList.add('active');
            };
            reader.onerror = function() {
                alert('图片读取失败，请重试');
            };
            reader.readAsDataURL(file);
        }

        function removeAgentImg() {
            agentImage = null;
            document.getElementById('agentImgPreview').classList.remove('active');
            document.getElementById('agentFileInput').value = '';
        }

        function handleLogo(e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(ev) {
                pendingLogo = ev.target.result;
                const preview = document.getElementById('logoPreview');
                preview.innerHTML = `<img src="${pendingLogo}" alt="Logo">`;
            };
            reader.readAsDataURL(file);
        }

        async function saveSettings() {
            const name = document.getElementById('nameInput').value.trim();
            if (!name) { alert('请输入名称'); return; }
            if (!sb) { alert('数据库连接失败'); return; }
            const { error } = await sb.from('config').upsert({key: 'title', value: name});
            alert(error ? '保存失败：' + error.message : '✅ 保存成功（所有设备生效）');
        }

        async function saveLogo() {
            if (!pendingLogo) { alert('请先选择Logo图片'); return; }
            if (!sb) { alert('数据库连接失败'); return; }
            const logo = await compressImage(pendingLogo, 300, 0.85);
            const { error } = await sb.from('config').upsert({key: 'logo', value: logo});
            if (error) { alert('保存失败：' + error.message); return; }
            pendingLogo = null;
            alert('✅ Logo已保存（所有设备生效）');
        }

        async function loadConfig() {
            if (!sb) return;
            try {
                const { data } = await sb.from('config').select('key, value').in('key', ['title', 'logo']);
                const cfg = {};
                (data || []).forEach(r => cfg[r.key] = r.value);
                const preview = document.getElementById('logoPreview');
                if (cfg.logo) {
                    preview.innerHTML = '';
                    const img = document.createElement('img');
                    img.src = cfg.logo;
                    img.alt = 'Logo';
                    preview.appendChild(img);
                }
                if (cfg.title) document.getElementById('nameInput').value = cfg.title;
            } catch(e) { console.error('加载配置失败', e); }
        }

        function escapeHtml(text) {
            if (!text) return '';
            const d = document.createElement('div');
            d.textContent = text;
            return d.innerHTML;
        }

        document.getElementById('agentInput').addEventListener('input', function() {
            this.style.height = 'auto';
            this.style.height = Math.min(this.scrollHeight, 80) + 'px';
            document.getElementById('agentSendBtn').disabled = !this.value.trim() && !agentImage;
        });

        document.getElementById('agentInput').addEventListener('keydown', function(e) {
            if (e.key === 'Enter' && !e.shiftKey) { 
                e.preventDefault(); 
                agentSend(); 
            }
        });

        window.addEventListener('load', function() {
            if (sessionStorage.getItem('adminAuthenticated')) {
                initApp();
            }
        });
    </script>
</body>
</html>
