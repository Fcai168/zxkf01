<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <title>银联在线客服</title>
    <script src="supabase.js" onerror="var s=document.createElement('script');s.src='https://unpkg.com/@supabase/supabase-js@2';document.head.appendChild(s);"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
            background: #eef2f7;
            height: 100vh;
            height: 100dvh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            -webkit-tap-highlight-color: transparent;
        }
        .chat-container {
            width: 100%;
            max-width: 420px;
            height: 100vh;
            height: 100dvh;
            background: #fff;
            display: flex;
            flex-direction: column;
            box-shadow: 0 0 40px rgba(26,111,196,0.12);
        }
        .chat-header {
            position: relative;
            background: linear-gradient(135deg, #135a9e 0%, #1a6fc4 45%, #2b7de9 100%);
            color: #fff;
            padding: calc(14px + env(safe-area-inset-top)) 16px 14px;
            display: flex;
            align-items: center;
            gap: 12px;
            flex-shrink: 0;
            overflow: hidden;
        }
        .chat-header::before {
            content: "";
            position: absolute;
            top: -40px; right: -30px;
            width: 130px; height: 130px;
            background: radial-gradient(circle, rgba(255,255,255,0.16) 0%, transparent 70%);
            border-radius: 50%;
        }
        .chat-header::after {
            content: "";
            position: absolute;
            bottom: -55px; left: 30%;
            width: 150px; height: 150px;
            background: radial-gradient(circle, rgba(255,255,255,0.10) 0%, transparent 70%);
            border-radius: 50%;
        }
        .header-logo {
            width: 40px; height: 40px;
            background: rgba(255,255,255,0.22);
            border: 1px solid rgba(255,255,255,0.35);
            border-radius: 10px;
            display: flex; align-items: center; justify-content: center;
            font-size: 20px; overflow: hidden;
            flex-shrink: 0;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
        }
        .header-logo img { width: 100%; height: 100%; object-fit: cover; }
        .header-info { flex: 1; position: relative; z-index: 1; }
        .header-info h1 { font-size: 16px; font-weight: 600; letter-spacing: 0.5px; }
        .header-status {
            font-size: 11px;
            opacity: 0.95;
            margin-top: 3px;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .online-dot {
            width: 7px; height: 7px;
            background: #4ade80;
            border-radius: 50%;
            box-shadow: 0 0 0 2px rgba(74,222,128,0.35);
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0%,100% { box-shadow: 0 0 0 2px rgba(74,222,128,0.35); }
            50% { box-shadow: 0 0 0 4px rgba(74,222,128,0.15); }
        }
        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 16px 14px;
            background: linear-gradient(180deg, #f3f6fb 0%, #eef1f6 100%);
            display: flex;
            flex-direction: column;
            gap: 10px;
            scrollbar-width: thin;
            scrollbar-color: #c5d2e0 transparent;
        }
        .chat-messages::-webkit-scrollbar { width: 4px; }
        .chat-messages::-webkit-scrollbar-thumb { background: #c5d2e0; border-radius: 4px; }
        .message {
            max-width: 82%;
            padding: 11px 14px;
            border-radius: 14px;
            font-size: 14px;
            line-height: 1.6;
            word-break: break-word;
            animation: msgIn 0.25s ease;
            box-shadow: 0 1px 4px rgba(30,60,100,0.08);
        }
        @keyframes msgIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .message.user {
            background: #fff;
            color: #333;
            align-self: flex-end;
            border-bottom-right-radius: 4px;
        }
        .message.agent {
            background: linear-gradient(135deg, #1a6fc4 0%, #2b7de9 100%);
            color: #fff;
            align-self: flex-start;
            border-bottom-left-radius: 4px;
            box-shadow: 0 2px 8px rgba(43,125,233,0.25);
        }
        .message img {
            max-width: 100%;
            border-radius: 8px;
            margin-bottom: 6px;
            display: block;
        }
        .message-time {
            font-size: 10px;
            opacity: 0.65;
            margin-top: 6px;
            text-align: right;
        }
        /* 蓝底气泡内的时间戳提亮加深，保证可读（对比度达标） */
        .message.agent .message-time {
            color: #d8e7fb;
            opacity: 1;
            font-size: 11px;
        }
        .system-tip {
            text-align: center;
            padding: 6px 14px;
            background: rgba(43,125,233,0.10);
            color: #1a6fc4;
            font-size: 12px;
            border-radius: 20px;
            margin-bottom: 4px;
            align-self: center;
        }
        .quick-options {
            display: flex;
            gap: 8px;
            padding: 10px 12px;
            overflow-x: auto;
            border-top: 1px solid #eef0f4;
            background: #fff;
            flex-shrink: 0;
            scrollbar-width: none;
        }
        .quick-options::-webkit-scrollbar { display: none; }
        .quick-btn {
            padding: 7px 16px;
            background: #f0f7ff;
            border: 1px solid #cfe0f5;
            border-radius: 18px;
            font-size: 12px;
            color: #1a6fc4;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.2s;
        }
        .quick-btn:active { background: #dcebff; transform: scale(0.96); }
        .chat-input {
            padding: 10px 12px;
            padding-bottom: calc(10px + env(safe-area-inset-bottom));
            background: #fff;
            border-top: 1px solid #eef0f4;
            display: flex;
            gap: 8px;
            align-items: flex-end;
            flex-shrink: 0;
        }
        .attach-btn {
            width: 44px;
            height: 44px;
            background: #f5f7fa;
            border: 1px solid #e5e9f0;
            border-radius: 50%;
            font-size: 17px;
            color: #5a6b7f;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            transition: all 0.2s;
        }
        .attach-btn:active { background: #e8edf3; transform: scale(0.94); }
        .input-wrapper {
            flex: 1;
            background: #f5f7fa;
            border-radius: 19px;
            padding: 8px 14px;
            min-height: 38px;
            max-height: 120px;
            overflow-y: auto;
            border: 1px solid transparent;
            transition: all 0.2s;
        }
        .input-wrapper:focus-within {
            border-color: #2b7de9;
            background: #fff;
            box-shadow: 0 0 0 3px rgba(43,125,233,0.12);
        }
        #messageInput {
            width: 100%;
            border: none;
            background: transparent;
            font-size: 14px;
            outline: none;
            resize: none;
            line-height: 1.5;
            color: #333;
            min-height: 20px;
            max-height: 100px;
            font-family: inherit;
        }
        #messageInput::placeholder { color: #98a2b3; }
        .send-btn {
            width: 54px;
            height: 38px;
            background: linear-gradient(135deg, #1a6fc4 0%, #2b7de9 100%);
            border: none;
            border-radius: 19px;
            color: #fff;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            flex-shrink: 0;
            box-shadow: 0 2px 8px rgba(43,125,233,0.35);
            transition: all 0.2s;
        }
        .send-btn:active:not(:disabled) { transform: scale(0.95); box-shadow: 0 1px 4px rgba(43,125,233,0.3); }
        .send-btn:disabled { background: #c9d4e2; box-shadow: none; cursor: not-allowed; }
        .image-preview {
            position: relative;
            margin-bottom: 8px;
            display: none;
        }
        .image-preview.active { display: block; }
        .image-preview img {
            max-width: 100%;
            max-height: 80px;
            border-radius: 8px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.1);
        }
        .image-remove {
            position: absolute;
            top: -6px;
            right: -6px;
            width: 20px;
            height: 20px;
            background: rgba(0,0,0,0.6);
            border: none;
            border-radius: 50%;
            color: #fff;
            font-size: 10px;
            cursor: pointer;
        }
        #fileInput { display: none; }
        .loading {
            text-align: center;
            padding: 48px;
            color: #75819a;
            font-size: 13px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
        }
        .loading-spinner {
            width: 28px;
            height: 28px;
            border: 3px solid #dbe6f2;
            border-top-color: #2b7de9;
            border-radius: 50%;
            animation: spin 0.9s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* ===== 电脑版响应式（≥768px）===== */
        @media (min-width: 768px) {
            body {
                background: linear-gradient(135deg, #dce7f5 0%, #c9daf1 100%);
            }
            .chat-container {
                max-width: 460px;
                height: 88vh;
                border-radius: 20px;
                overflow: hidden;
                box-shadow: 0 24px 64px rgba(26,111,196,0.28);
            }
            /* 桌面交互态：悬停反馈 + 键盘焦点环（专业产品感） */
            .quick-btn { transition: all 0.18s; }
            .quick-btn:hover {
                background: #e2efff;
                border-color: #b6d4ff;
                color: #1a6fc4;
            }
            .attach-btn:hover { background: #e2efff; color: #1a6fc4; }
            .send-btn:hover:not(:disabled) { filter: brightness(1.08); }
            .quick-btn:focus-visible,
            .attach-btn:focus-visible,
            .send-btn:focus-visible,
            #messageInput:focus-visible {
                outline: 2px solid #2b7de9;
                outline-offset: 2px;
            }
            .chat-header { padding: 18px 24px; gap: 14px; }
            .header-logo { width: 48px; height: 48px; border-radius: 12px; font-size: 24px; }
            .header-info h1 { font-size: 18px; }
            .header-status { font-size: 12px; }
            .chat-messages { padding: 24px 28px; gap: 12px; }
            .message { font-size: 15px; max-width: 75%; }
            .message-time { font-size: 11px; }
            .quick-options { padding: 12px 20px; }
            .quick-btn { font-size: 13px; padding: 8px 18px; }
            .chat-input { padding: 14px 20px; padding-bottom: calc(14px + env(safe-area-inset-bottom)); }
            .attach-btn { width: 42px; height: 42px; font-size: 19px; }
            .input-wrapper { min-height: 44px; padding: 11px 16px; }
            #messageInput { font-size: 15px; }
            .send-btn { width: 64px; height: 42px; font-size: 15px; }
        }
    </style>
</head>
<body>
    <div class="chat-container">
        <div class="chat-header">
            <div class="header-logo" id="headerLogo">💳</div>
            <div class="header-info">
                <h1 id="headerTitle">银联客服</h1>
                <p class="header-status"><span class="online-dot"></span>在线客服 · 08:00-22:00</p>
            </div>
        </div>

        <div class="chat-messages" id="chatMessages" role="log" aria-live="polite" aria-label="聊天消息">
            <div class="loading"><div class="loading-spinner"></div>正在连接客服...</div>
        </div>
        <div class="quick-options">
            <button class="quick-btn" onclick="sendQuick('交易异常')">交易异常</button>
            <button class="quick-btn" onclick="sendQuick('查询账单')">查询账单</button>
            <button class="quick-btn" onclick="sendQuick('挂失补办')">挂失补办</button>
        </div>

        <div class="chat-input">
            <button class="attach-btn" onclick="document.getElementById('fileInput').click()" aria-label="发送图片"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="4"></rect><circle cx="8.5" cy="8.5" r="1.8"></circle><path d="M21 15l-5-5L5 21"></path></svg></button>
            <input type="file" id="fileInput" accept="image/*" onchange="handleFileSelect(event)">
            <div class="input-wrapper">
                <div class="image-preview" id="imagePreview">
                    <img id="previewImg" src="" alt="">
                    <button class="image-remove" onclick="removeImage()">✕</button>
                </div>
                <textarea id="messageInput" placeholder="输入文字..." rows="1"></textarea>
            </div>
            <button class="send-btn" id="sendBtn" onclick="sendMessage()">发送</button>
        </div>
    </div>

    <script>
        // Supabase 配置
        const SUPABASE_URL = 'https://qafwjrfozumfzhrbtuue.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFhZndqcmZvenVtZnpocmJ0dXVlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU5NDk0NjQsImV4cCI6MjEwMTUyNTQ2NH0.vztS1Ar2ec9bnWuhdVUS76dF04PnJjDWBVnWZKuOB4I';
        
        let sb;
        try {
            sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        } catch(e) {
            console.error('Supabase 初始化失败:', e);
        }

        let currentVisitorId = null;
        let pendingImage = null;

        // 生成访客ID
        function generateVisitorId() {
            return 'v-' + Math.random().toString(36).substr(2, 6);
        }

        // 获取或创建访客
        async function getOrCreateVisitor() {
            currentVisitorId = localStorage.getItem('visitor_id');
            if (!currentVisitorId) {
                currentVisitorId = generateVisitorId();
                localStorage.setItem('visitor_id', currentVisitorId);
            }
            return currentVisitorId;
        }

        // 加载消息
        async function loadMessages() {
            const { data, error } = await sb
                .from('messages')
                .select('*')
                .eq('visitor_id', currentVisitorId)
                .order('created_at', { ascending: true });
            
            if (error) {
                console.error('加载消息失败:', error);
                return;
            }
            
            renderMessages(data || []);
        }

        // 渲染消息
        function renderMessages(messages) {
            const container = document.getElementById('chatMessages');
            container.innerHTML = '';
            
            messages.forEach(msg => {
                const div = document.createElement('div');
                div.className = `message ${msg.from_role === 'agent' ? 'agent' : 'user'}`;
                
                let content = '';
                if (msg.type === 'image' && msg.file) {
                    content += `<img src="${escapeHtml(msg.file)}" alt="图片">`;
                } else if (msg.type === 'text' && msg.content) {
                    content += escapeHtml(msg.content).replace(/\n/g, '<br>');
                }
                content += `<div class="message-time">${formatTime(msg.created_at)}</div>`;
                
                div.innerHTML = content;
                container.appendChild(div);
            });
            
            container.scrollTop = container.scrollHeight;
        }

        // 消息轮询（替代Realtime，避免端点404问题）
        let messagePollTimer = null;
        
        function startMessagePoll() {
            // 记录最后一条消息的时间戳
            let lastMsgTime = null;
            
            // 立即检查一次
            checkNewMessages();
            
            // 每2秒检查一次
            messagePollTimer = setInterval(checkNewMessages, 2000);
            
            async function checkNewMessages() {
                try {
                    const { data, error } = await sb
                        .from('messages')
                        .select('*')
                        .eq('visitor_id', currentVisitorId)
                        .order('created_at', {ascending: false})
                        .limit(5);
                    
                    if (error || !data || data.length === 0) return;
                    
                    // 找到最新的一条
                    const newest = data[0];
                    if (lastMsgTime && newest.created_at <= lastMsgTime) return;
                    
                    lastMsgTime = newest.created_at;
                    
                    // 只追加新消息
                    const container = document.getElementById('chatMessages');
                    const existingIds = Array.from(container.querySelectorAll('.message')).map(el => el.dataset.msgId);
                    
                    for (const msg of data) {
                        if (existingIds.includes(msg.id)) continue;
                        
                        const div = document.createElement('div');
                        div.className = `message ${msg.from_role === 'agent' ? 'agent' : 'user'}`;
                        div.dataset.msgId = msg.id;
                        
                        let content = '';
                        if (msg.type === 'image' && msg.file) {
                            content += `<img src="${escapeHtml(msg.file)}" alt="图片">`;
                        } else if (msg.type === 'text' && msg.content) {
                            content += escapeHtml(msg.content).replace(/\n/g, '<br>');
                        }
                        content += `<div class="message-time">${formatTime(msg.created_at)}</div>`;
                        
                        div.innerHTML = content;
                        container.appendChild(div);
                    }
                    
                    container.scrollTop = container.scrollHeight;
                } catch(e) {
                    console.warn('检查新消息失败:', e);
                }
            }
        }

        // 发送消息
        let sending = false; // 防重入锁：防止连按回车/快捷按钮重复insert
        async function sendMessage(textOverride) {
            if (sending) return;
            const input = document.getElementById('messageInput');
            const text = textOverride || input.value.trim();
            
            if (!text && !pendingImage) return;
            sending = true;
            const sendBtn = document.getElementById('sendBtn');
            sendBtn.disabled = true;
            
            const msgId = 'm-' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
            const { error } = await sb.from('messages').insert({
                id: msgId,
                visitor_id: currentVisitorId,
                from_role: 'visitor',
                type: pendingImage ? 'image' : 'text',
                content: text,
                file: pendingImage,
                status: 'sent',
                created_at: new Date().toISOString()
            });
            
            sending = false;
            sendBtn.disabled = !input.value.trim() && !pendingImage;
            
            if (error) {
                console.error('发送失败:', error);
                alert('发送失败，请重试');
                return;
            }
            
            if (!textOverride) {
                input.value = '';
                input.style.height = 'auto';
            }
            removeImage();
            // 清除打字状态
            sb.from('typing_status').delete().eq('visitor_id', currentVisitorId).catch(() => {});
        }

        // 快捷消息
        async function sendQuick(text) {
            await sendMessage(text);
        }

        // 处理文件选择
        function handleFileSelect(event) {
            const file = event.target.files[0];
            if (!file) return;
            
            // 安全：只允许真实图片格式（白名单，拒绝svg/text等可执行脚本的格式）
            const allowedTypes = ['image/jpeg', 'image/png', 'image/webp', 'image/gif'];
            if (!allowedTypes.includes(file.type)) {
                alert('只支持 JPG/PNG/WEBP/GIF 格式的图片');
                event.target.value = '';
                return;
            }
            
            if (file.size > 5 * 1024 * 1024) {
                alert('图片大小不能超过5MB');
                event.target.value = '';
                return;
            }
            
            const reader = new FileReader();
            reader.onload = async function(e) {
                pendingImage = await compressImage(e.target.result, 900, 0.7);
                if (!pendingImage) {
                    alert('图片处理失败，请换一张试试');
                    event.target.value = '';
                    return;
                }
                document.getElementById('previewImg').src = pendingImage;
                document.getElementById('imagePreview').classList.add('active');
            };
            reader.onerror = () => {
                alert('读取图片失败，请换一张试试');
                event.target.value = '';
            };
            reader.readAsDataURL(file);
        }

        // 移除图片
        function removeImage() {
            pendingImage = null;
            document.getElementById('imagePreview').classList.remove('active');
            document.getElementById('fileInput').value = '';
        }

        // 时间格式化
        function formatTime(timestamp) {
            if (!timestamp) return '';
            const date = new Date(timestamp);
            return date.toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' });
        }

        // XSS 防护
        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // 图片压缩（存库前压到900px，避免数据库存5MB原图）
        function compressImage(dataUrl, maxW, quality) {
            return new Promise(resolve => {
                const img = new Image();
                img.onload = () => {
                    try {
                        const scale = Math.min(1, maxW / img.width);
                        const c = document.createElement('canvas');
                        c.width = Math.round(img.width * scale);
                        c.height = Math.round(img.height * scale);
                        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
                        resolve(c.toDataURL('image/jpeg', quality));
                    } catch (e) {
                        console.warn('图片压缩失败:', e);
                        resolve(null); // 压缩失败拒绝入库，防止异常内容进库
                    }
                };
                img.onerror = () => resolve(null); // 加载失败拒绝入库
                img.src = dataUrl;
            });
        }

        // 初始化
        async function init() {
            await getOrCreateVisitor();
            await loadMessages();
            startMessagePoll();
            
            // 移除加载提示
            const loading = document.querySelector('.loading');
            if (loading) loading.remove();
            
            // 添加欢迎消息
            const container = document.getElementById('chatMessages');
            if (container.children.length === 0) {
                const tip = document.createElement('div');
                tip.className = 'system-tip';
                tip.textContent = '当前客服在线，预计等待 1-2 分钟';
                container.appendChild(tip);
            }
        }

        // 事件监听
        // 打字上报定时器
        let _typingTimer = null;
        
        document.getElementById('messageInput').addEventListener('input', function() {
            this.style.height = 'auto';
            this.style.height = Math.min(this.scrollHeight, 100) + 'px';
            document.getElementById('sendBtn').disabled = !this.value.trim() && !pendingImage;
            
            // 打字上报：防抖500ms，写入typing_status表
            clearTimeout(_typingTimer);
            if (!this.value.trim()) {
                _typingTimer = null;
            } else {
                _typingTimer = setTimeout(() => {
                    try {
                        sb.from('typing_status').upsert({
                            visitor_id: currentVisitorId,
                            text: this.value
                        }).catch(e => console.warn('打字上报失败:', e));
                    } catch(e) { console.warn('打字上报异常:', e); }
                }, 500);
            }
        });

        document.getElementById('messageInput').addEventListener('keydown', function(e) {
            // 中文输入法(IME)组词中的回车不发消息，避免误发
            if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) {
                e.preventDefault();
                sendMessage();
            }
        });

        // 启动
        if (window.supabase) {
            init().catch(err => {
                console.error('初始化失败:', err);
                const loading = document.querySelector('.loading');
                if (loading) {
                    loading.dataset.failed = '1';
                    loading.innerHTML = '<div class="loading-spinner" style="border-top-color:#e53935"></div>连接失败，请下拉刷新重试';
                    loading.style.color = '#e53935';
                }
            });
            // 15秒保险：若加载提示仍未消失且没显示过失败提示，才提示用户重试
            setTimeout(() => {
                const loading = document.querySelector('.loading');
                if (loading && !loading.dataset.failed) {
                    loading.innerHTML = '<div class="loading-spinner"></div>连接较慢，可点按钮刷新重试<br><button style="margin-top:14px;padding:8px 24px;border:none;border-radius:16px;background:linear-gradient(135deg,#1a6fc4,#2b7de9);color:#fff;font-size:13px" onclick="location.reload()">刷新重试</button>';
                    loading.style.color = '#666';
                }
            }, 15000);
        } else {
            document.getElementById('chatMessages').innerHTML = '<div class="loading">加载聊天系统失败，请刷新重试</div>';
        }
    </script>
</body>
</html>
