<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>银联客服后台</title>
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <script src="supabase.js" onerror="var s=document.createElement('script');s.src='https://unpkg.com/@supabase/supabase-js@2';document.head.appendChild(s);"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/umd/supabase.js" onerror="console.warn('CDN2失败');"></script>
<script src="https://unpkg.com/@supabase/supabase-js@2/dist/umd/supabase.js" onerror="console.warn('CDN3失败');"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        :root {
            --primary: #1a6fc4;
            --primary-dark: #0f4c8c;
            --primary-light: #e8f0fe;
            --success: #22c55e;
            --warning: #f59e0b;
            --danger: #ef4444;
            --bg: #f0f4f8;
            --card: #ffffff;
            --text: #1a1a2e;
            --text-secondary: #6b7280;
            --border: #e5e7eb;
            --shadow: 0 2px 8px rgba(0,0,0,0.08);
            --shadow-lg: 0 8px 32px rgba(0,0,0,0.12);
        }
        
        html, body {
            height: 100%;
            height: 100dvh;
            font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
            background: var(--bg);
            color: var(--text);
            overflow: hidden;
        }
        
        /* ===== 登录页 ===== */
        .login-overlay {
            position: fixed;
            inset: 0;
            background: linear-gradient(135deg, var(--primary-dark) 0%, var(--primary) 50%, #2b7de9 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
        }
        .login-card {
            background: rgba(255,255,255,0.97);
            backdrop-filter: blur(20px);
            border-radius: 24px;
            padding: 40px 32px;
            width: 90%;
            max-width: 360px;
            box-shadow: var(--shadow-lg);
            text-align: center;
        }
        .login-logo {
            width: 64px; height: 64px;
            background: linear-gradient(135deg, var(--primary) 0%, #2b7de9 100%);
            border-radius: 16px;
            margin: 0 auto 20px;
            display: flex; align-items: center; justify-content: center;
            font-size: 28px;
            box-shadow: 0 4px 16px rgba(26,111,196,0.3);
        }
        .login-card h2 {
            font-size: 22px;
            font-weight: 600;
            margin-bottom: 8px;
            color: var(--text);
        }
        .login-card p {
            font-size: 13px;
            color: var(--text-secondary);
            margin-bottom: 24px;
        }
        .login-input {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid var(--border);
            border-radius: 12px;
            font-size: 16px;
            transition: all 0.2s;
            background: var(--bg);
        }
        .login-input:focus {
            outline: none;
            border-color: var(--primary);
            background: #fff;
            box-shadow: 0 0 0 4px rgba(26,111,196,0.1);
        }
        .login-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, var(--primary) 0%, #2b7de9 100%);
            color: #fff;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 12px;
            transition: all 0.2s;
            box-shadow: 0 4px 12px rgba(26,111,196,0.3);
        }
        .login-btn:active { transform: scale(0.98); }
        .login-hint {
            margin-top: 16px;
            font-size: 12px;
            color: var(--text-secondary);
        }
        
        /* ===== 主布局 ===== */
        .app-container {
            display: none;
            flex-direction: column;
            height: 100%;
            height: 100dvh;
        }
        
        /* 顶部导航 */
        .topbar {
            background: linear-gradient(135deg, var(--primary-dark) 0%, var(--primary) 100%);
            color: #fff;
            padding: 12px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 2px 12px rgba(26,111,196,0.25);
            position: relative;
            z-index: 100;
            flex-shrink: 0;
        }
        .topbar-title {
            font-size: 17px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .topbar-actions {
            display: flex;
            gap: 8px;
        }
        .topbar-btn {
            background: rgba(255,255,255,0.2);
            border: none;
            color: #fff;
            padding: 8px 14px;
            border-radius: 10px;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s;
            backdrop-filter: blur(10px);
        }
        .topbar-btn:active { background: rgba(255,255,255,0.3); transform: scale(0.96); }
        
        /* 主内容区 */
        .main-content {
            flex: 1;
            display: flex;
            overflow: hidden;
            position: relative;
        }
        
        /* 用户列表侧栏 */
        .user-sidebar {
            width: 100%;
            background: var(--card);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            position: absolute;
            inset: 0;
            z-index: 10;
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .user-sidebar.open { transform: translateX(0); }
        
        .sidebar-tabs {
            display: flex;
            background: var(--bg);
            padding: 8px;
            gap: 8px;
            border-bottom: 1px solid var(--border);
        }
        .tab-btn {
            flex: 1;
            padding: 10px;
            background: transparent;
            border: none;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 500;
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.2s;
        }
        .tab-btn.active {
            background: var(--card);
            color: var(--primary);
            box-shadow: var(--shadow);
        }
        
        .user-list {
            flex: 1;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
        }
        .user-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
            border-bottom: 1px solid var(--border);
            cursor: pointer;
            transition: all 0.15s;
        }
        .user-item:active { background: var(--primary-light); }
        .user-item.active {
            background: linear-gradient(90deg, var(--primary-light) 0%, transparent 100%);
            border-left: 3px solid var(--primary);
        }
        .user-avatar {
            width: 44px; height: 44px;
            background: linear-gradient(135deg, #e8f0fe 0%, #c9dffb 100%);
            border-radius: 12px;
            display: flex; align-items: center; justify-content: center;
            font-size: 20px;
            flex-shrink: 0;
            position: relative;
        }
        .status-dot {
            position: absolute;
            bottom: 2px; right: 2px;
            width: 12px; height: 12px;
            border-radius: 50%;
            border: 2px solid var(--card);
        }
        .status-dot.online { background: var(--success); }
        .status-dot.offline { background: #9ca3af; }
        .user-info { flex: 1; min-width: 0; }
        .user-name {
            font-size: 14px;
            font-weight: 500;
            color: var(--text);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .user-meta {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-top: 2px;
        }
        .user-status {
            font-size: 11px;
            color: var(--text-secondary);
        }
        .user-status.online { color: var(--success); }
        .unread-badge {
            background: var(--danger);
            color: #fff;
            font-size: 11px;
            font-weight: 600;
            padding: 2px 6px;
            border-radius: 10px;
            min-width: 18px;
            text-align: center;
        }
        
        /* 聊天区域 */
        .chat-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: var(--bg);
            position: relative;
        }
        
        .chat-header {
            background: var(--card);
            padding: 12px 16px;
            display: flex;
            align-items: center;
            gap: 12px;
            border-bottom: 1px solid var(--border);
            box-shadow: var(--shadow);
        }
        .back-btn {
            display: none;
            background: none;
            border: none;
            font-size: 20px;
            cursor: pointer;
            padding: 4px 8px;
            color: var(--primary);
        }
        .chat-avatar {
            width: 40px; height: 40px;
            background: linear-gradient(135deg, #e8f0fe 0%, #c9dffb 100%);
            border-radius: 10px;
            display: flex; align-items: center; justify-content: center;
            font-size: 18px;
            flex-shrink: 0;
        }
        .chat-info { flex: 1; }
        .chat-name { font-size: 15px; font-weight: 600; }
        .chat-status { font-size: 12px; color: var(--text-secondary); margin-top: 2px; }
        
        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            background: linear-gradient(180deg, #f8fafc 0%, var(--bg) 100%);
        }
        
        .msg {
            max-width: 80%;
            padding: 12px 16px;
            border-radius: 16px;
            font-size: 14px;
            line-height: 1.6;
            word-break: break-word;
            animation: msgIn 0.2s ease;
        }
        @keyframes msgIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .msg.user {
            background: var(--card);
            color: var(--text);
            align-self: flex-start;
            border-bottom-left-radius: 4px;
            box-shadow: var(--shadow);
        }
        .msg.agent {
            background: linear-gradient(135deg, var(--primary) 0%, #2b7de9 100%);
            color: #fff;
            align-self: flex-end;
            border-bottom-right-radius: 4px;
            box-shadow: 0 4px 12px rgba(26,111,196,0.25);
        }
        .msg img {
            max-width: 100%;
            border-radius: 12px;
            margin-bottom: 4px;
        }
        .msg-time {
            font-size: 11px;
            opacity: 0.6;
            margin-top: 6px;
            text-align: right;
        }
        .msg.user .msg-time { color: var(--text-secondary); }
        
        .empty-state {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: var(--text-secondary);
            gap: 12px;
        }
        .empty-state-icon { font-size: 48px; opacity: 0.3; }
        .empty-state-text { font-size: 14px; }
        
        /* 打字指示器 */
        .typing-indicator {
            display: none;
            padding: 8px 16px;
            font-size: 12px;
            color: var(--primary);
            background: var(--primary-light);
            border-top: 1px solid rgba(26,111,196,0.1);
            animation: typingPulse 1.5s infinite;
        }
        .typing-indicator.active { display: flex; align-items: center; gap: 8px; }
        @keyframes typingPulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }
        .typing-dots {
            display: flex;
            gap: 3px;
        }
        .typing-dots span {
            width: 6px; height: 6px;
            background: var(--primary);
            border-radius: 50%;
            animation: dotBounce 1.4s infinite;
        }
        .typing-dots span:nth-child(2) { animation-delay: 0.2s; }
        .typing-dots span:nth-child(3) { animation-delay: 0.4s; }
        @keyframes dotBounce {
            0%, 60%, 100% { transform: translateY(0); }
            30% { transform: translateY(-4px); }
        }
        
        /* 输入区域 */
        .chat-input {
            background: var(--card);
            padding: 12px;
            border-top: 1px solid var(--border);
            display: flex;
            gap: 10px;
            align-items: flex-end;
        }
        .input-tools { display: flex; gap: 8px; }
        .tool-btn {
            width: 44px; height: 44px;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            font-size: 18px;
            cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            transition: all 0.2s;
        }
        .tool-btn:active { background: var(--primary-light); transform: scale(0.95); }
        .input-wrapper {
            flex: 1;
            background: var(--bg);
            border: 2px solid var(--border);
            border-radius: 14px;
            padding: 10px 14px;
            min-height: 44px;
            max-height: 120px;
            overflow-y: auto;
            transition: all 0.2s;
        }
        .input-wrapper:focus-within {
            border-color: var(--primary);
            background: #fff;
            box-shadow: 0 0 0 4px rgba(26,111,196,0.1);
        }
        #agentInput {
            width: 100%;
            border: none;
            background: transparent;
            font-size: 15px;
            line-height: 1.5;
            resize: none;
            outline: none;
            font-family: inherit;
        }
        .send-btn {
            width: 48px; height: 48px;
            background: linear-gradient(135deg, var(--primary) 0%, #2b7de9 100%);
            border: none;
            border-radius: 14px;
            color: #fff;
            font-size: 18px;
            cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 4px 12px rgba(26,111,196,0.3);
            transition: all 0.2s;
        }
        .send-btn:active { transform: scale(0.95); }
        .send-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        
        /* 新消息横幅 */
        .new-msg-banner {
            position: fixed;
            top: calc(56px + env(safe-area-inset-top));
            left: 50%;
            transform: translateX(-50%) translateY(-100%);
            background: linear-gradient(135deg, var(--primary) 0%, #2b7de9 100%);
            color: #fff;
            padding: 12px 20px;
            border-radius: 14px;
            box-shadow: var(--shadow-lg);
            font-size: 14px;
            z-index: 1000;
            cursor: pointer;
            opacity: 0;
            transition: all 0.3s;
        }
        .new-msg-banner.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }
        
        /* 设置页面 */
        .settings-page {
            display: none;
            flex-direction: column;
            flex: 1;
            overflow: hidden;
        }
        .settings-header {
            background: var(--card);
            padding: 16px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .back-btn-settings {
            background: none;
            border: none;
            font-size: 20px;
            cursor: pointer;
            color: var(--primary);
            padding: 4px 8px;
        }
        .settings-content {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
        }
        .setting-card {
            background: var(--card);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 16px;
            box-shadow: var(--shadow);
        }
        .setting-card-title {
            font-size: 15px;
            font-weight: 600;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .setting-row {
            display: flex;
            gap: 12px;
            align-items: center;
        }
        .setting-label {
            font-size: 14px;
            color: var(--text-secondary);
            min-width: 60px;
        }
        .setting-input {
            flex: 1;
            padding: 12px 14px;
            border: 2px solid var(--border);
            border-radius: 10px;
            font-size: 14px;
            transition: all 0.2s;
        }
        .setting-input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(26,111,196,0.1);
        }
        .save-btn {
            padding: 10px 20px;
            background: linear-gradient(135deg, var(--primary) 0%, #2b7de9 100%);
            color: #fff;
            border: none;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
        }
        .save-btn:active { transform: scale(0.96); }
        
        /* 图片预览 */
        .img-preview {
            display: none;
            position: relative;
            margin-bottom: 8px;
        }
        .img-preview.active { display: block; }
        .img-preview img {
            max-width: 100px;
            max-height: 80px;
            border-radius: 8px;
            display: block;
        }
        .img-remove {
            position: absolute;
            top: -6px; right: -6px;
            width: 22px; height: 22px;
            background: var(--danger);
            color: #fff;
            border: none;
            border-radius: 50%;
            font-size: 12px;
            cursor: pointer;
            display: flex; align-items: center; justify-content: center;
        }
        
        /* ===== 响应式 ===== */
        @media (min-width: 768px) {
            .user-sidebar {
                position: relative;
                width: 320px;
                transform: none !important;
                border-right: 1px solid var(--border);
            }
            .back-btn { display: none !important; }
            .chat-header { padding: 14px 20px; }
            .chat-messages { padding: 20px; }
            .chat-input { padding: 14px 20px; }
            .msg { max-width: 70%; }
        }
        
        @media (max-width: 480px) {
            .login-card { padding: 32px 24px; }
            .login-logo { width: 56px; height: 56px; font-size: 24px; }
            .topbar { padding: 10px 12px; }
            .topbar-title { font-size: 15px; }
            .topbar-btn { padding: 6px 10px; font-size: 12px; }
        }
        
        /* 隐藏文件输入 */
        input[type="file"] { display: none; }
        
        /* 滚动条美化 */
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.15); border-radius: 2px; }
    </style>
</head>
<body>
    <!-- 登录遮罩 -->
    <div class="login-overlay" id="loginOverlay">
        <div class="login-card">
            <div class="login-logo">💬</div>
            <h2>客服后台管理</h2>
            <p>银联在线客服系统</p>
            <input type="password" id="passwordInput" class="login-input" placeholder="请输入管理密码" autocomplete="current-password">
            <button class="login-btn" onclick="checkPassword()">登录</button>
            <p class="login-hint" id="diagBox"></p>
        </div>
    </div>

    <!-- 主界面 -->
    <div class="app-container" id="mainInterface">
        <!-- 顶部导航 -->
        <div class="topbar">
            <div class="topbar-title">
                <span>💬</span>
                <span>客服后台</span>
            </div>
            <div class="topbar-actions">
                <button class="topbar-btn" onclick="switchMain('settings')">⚙️ 设置</button>
                <button class="topbar-btn" onclick="logout()">退出</button>
            </div>
        </div>

        <!-- 主内容 -->
        <div class="main-content">
            <!-- 用户列表侧栏 -->
            <div class="user-sidebar open" id="userSidebar">
                <div class="sidebar-tabs">
                    <button class="tab-btn active" onclick="switchUserTab('online', this)">办理中</button>
                    <button class="tab-btn" onclick="switchUserTab('history', this)">历史</button>
                </div>
                <div class="user-list" id="userList"></div>
            </div>

            <!-- 聊天区域 -->
            <div class="chat-area">
                <div class="chat-header">
                    <button class="back-btn" onclick="closeSidebar()">←</button>
                    <div class="chat-avatar">👤</div>
                    <div class="chat-info">
                        <div class="chat-name" id="chatName">选择用户</div>
                        <div class="chat-status" id="chatStatus">-</div>
                    </div>
                </div>
                
                <div class="chat-messages" id="chatMessages">
                    <div class="empty-state">
                        <div class="empty-state-icon">💬</div>
                        <div class="empty-state-text">请在左侧选择用户开始对话</div>
                    </div>
                </div>
                
                <div class="typing-indicator" id="typingIndicator">
                    <div class="typing-dots"><span></span><span></span><span></span></div>
                    <span>访客正在输入...</span>
                </div>
                
                <div class="chat-input">
                    <div class="input-tools">
                        <button class="tool-btn" onclick="document.getElementById('agentFileInput').click()" aria-label="发送图片">🖼️</button>
                        <input type="file" id="agentFileInput" accept="image/*" onchange="handleAgentFile(event)">
                    </div>
                    <div class="input-wrapper">
                        <div class="img-preview" id="agentImgPreview">
                            <img id="agentPreviewImg" src="" alt="">
                            <button class="img-remove" onclick="removeAgentImg()">✕</button>
                        </div>
                        <textarea id="agentInput" placeholder="输入回复..." rows="1"></textarea>
                    </div>
                    <button class="send-btn" id="agentSendBtn" onclick="agentSend()">➤</button>
                </div>
            </div>
        </div>

        <!-- 设置页面 -->
        <div class="settings-page" id="settingsPage">
            <div class="settings-header">
                <button class="back-btn-settings" onclick="switchMain('chat')">←</button>
                <span style="font-size:16px;font-weight:600;">设置</span>
            </div>
            <div class="settings-content">
                <div class="setting-card">
                    <div class="setting-card-title">🖼️ Logo设置</div>
                    <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap;">
                        <div id="logoPreview" style="width:60px;height:60px;background:#f3f4f6;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:24px;">💳</div>
                        <div style="flex:1;min-width:0;">
                            <label class="save-btn" style="display:inline-block;margin-bottom:8px;cursor:pointer;">
                                选择图片
                                <input type="file" id="logoInput" accept="image/*" style="display:none" onchange="handleLogo(event)">
                            </label>
                            <button class="save-btn" onclick="saveLogo()" style="background:var(--success);">保存Logo</button>
                        </div>
                    </div>
                </div>
                <div class="setting-card">
                    <div class="setting-card-title">📝 名称设置</div>
                    <div class="setting-row">
                        <span class="setting-label">客服名</span>
                        <input type="text" class="setting-input" id="nameInput" placeholder="输入名称" value="银联客服">
                        <button class="save-btn" onclick="saveSettings()">保存</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 新消息横幅 -->
    <div class="new-msg-banner" id="newMsgBanner" onclick="jumpToUser()"></div>

    <script>
        // Supabase 配置
        const SUPABASE_URL = 'https://qafwjrfozumfzhrbtuue.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFhZndqcmZvenVtZnpocmJ0dXVlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU5NDk0NjQsImV4cCI6MjEwMTUyNTQ2NH0.vztS1Ar2ec9bnWuhdVUS76dF04PnJjDWBVnWZKuOB4I';
        
        let sb;
        try { sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY); } catch(e) { console.error('Supabase初始化失败:', e); }
        
        let currentUser = null;
        let users = [];
        let agentImage = null;
        let currentTab = 'online';
        let typingCheckTimer = null;
        let messagePollTimers = {};
        let chatSeq = 0;
        let chatKnownIds = null;
        let userListSeq = 0;
        let ADMIN_PASSWORD = null; // 从数据库读取，无则使用默认值
        const DEFAULT_ADMIN_PASSWORD = 'admin123'; // 默认密码（首次使用需修改）

        // 登录
        async function checkPassword() {
            const input = document.getElementById('passwordInput');
            const val = input.value.trim();
            if (!val) {
                document.getElementById('diagBox').textContent = '请先输入密码';
                return;
            }
            try {
                const { data } = await sb.from('config').select('value').eq('key', 'admin_password').single();
                if (data?.value) ADMIN_PASSWORD = data.value;
            } catch(e) {}
            // 如果数据库无配置，使用默认密码
            if (!ADMIN_PASSWORD) ADMIN_PASSWORD = DEFAULT_ADMIN_PASSWORD;
            
            if (val === ADMIN_PASSWORD) {
                sessionStorage.setItem('adminAuthenticated', 'true');
                document.getElementById('loginOverlay').style.display = 'none';
                document.getElementById('mainInterface').style.display = 'flex';
                initApp();
            } else {
                document.getElementById('diagBox').textContent = '密码错误，请重试';
                input.style.borderColor = 'var(--danger)';
                setTimeout(() => input.style.borderColor = '', 2000);
            }
        }

        function logout() {
            sessionStorage.removeItem('adminAuthenticated');
            location.reload();
        }

        async function initApp() {
            document.getElementById('loginOverlay').style.display = 'none';
            document.getElementById('mainInterface').style.display = 'flex';
            await loadConfig();
            renderUserList();
            startListening();
        }

        function switchMain(tab) {
            const main = document.getElementById('chatMessages');
            const settings = document.getElementById('settingsPage');
            if (tab === 'settings') {
                document.querySelector('.main-content').style.display = 'none';
                settings.style.display = 'flex';
            } else {
                document.querySelector('.main-content').style.display = 'flex';
                settings.style.display = 'none';
            }
        }

        function switchUserTab(type, el) {
            document.querySelectorAll('.tab-btn').forEach(t => t.classList.remove('active'));
            el.classList.add('active');
            currentTab = type;
            renderUserList();
        }

        async function renderUserList() {
            const list = document.getElementById('userList');
            if (!sb) { list.innerHTML = '<div style="padding:20px;text-align:center;color:var(--text-secondary)">数据库连接失败</div>'; return; }
            
            const seq = ++userListSeq;
            try {
                const { data: msgs } = await sb.from('messages').select('id, visitor_id, from_role, status, created_at').order('created_at', {ascending: true});
                if (seq !== userListSeq) return;
                
                const groups = {};
                (msgs || []).forEach(m => {
                    if (!groups[m.visitor_id]) groups[m.visitor_id] = {id: m.visitor_id, last: 0, total: 0, unread: 0};
                    groups[m.visitor_id].total++;
                    if (m.from_role === 'visitor') {
                        const t = new Date(m.created_at).getTime();
                        if (t > groups[m.visitor_id].last) groups[m.visitor_id].last = t;
                    }
                    if (m.from_role === 'visitor' && m.status !== 'read') groups[m.visitor_id].unread++;
                });
                
                const now = Date.now();
                const ONLINE_MS = 30 * 60 * 1000;
                users = Object.values(groups)
                    .map(g => ({...g, status: now - g.last < ONLINE_MS ? 'online' : 'offline', name: '访客 ' + g.id.slice(-4).toUpperCase()}))
                    .sort((a, b) => b.last - a.last);
                
                const filtered = currentTab === 'online' ? users.filter(u => u.status === 'online') : users;
                
                if (filtered.length === 0) {
                    list.innerHTML = '<div style="padding:40px 20px;text-align:center;color:var(--text-secondary)"><div style="font-size:32px;margin-bottom:12px;opacity:0.5">📭</div>暂无用户</div>';
                    return;
                }
                
                list.innerHTML = filtered.map(u => `
                    <div class="user-item ${currentUser?.id === u.id ? 'active' : ''}" onclick="selectUser('${u.id}')">
                        <div class="user-avatar">
                            👤
                            <span class="status-dot ${u.status}"></span>
                        </div>
                        <div class="user-info">
                            <div class="user-name">${escapeHtml(u.name)}${u.unread > 0 ? `<span class="unread-badge">${u.unread}</span>` : ''}</div>
                            <div class="user-meta">
                                <span class="user-status ${u.status}">${u.status === 'online' ? '在线' : '离线'}</span>
                                <span style="font-size:10px;color:var(--text-secondary)">${formatTimeShort(u.last)}</span>
                            </div>
                        </div>
                    </div>
                `).join('');
            } catch(e) { console.error('渲染用户列表失败', e); }
        }

        async function selectUser(userId) {
            currentUser = users.find(u => u.id === userId);
            if (!currentUser) return;
            
            document.getElementById('chatName').textContent = currentUser.name;
            document.getElementById('chatStatus').textContent = currentUser.status === 'online' ? '在线' : '离线';
            
            // 移动端关闭侧栏
            if (window.innerWidth < 768) {
                document.getElementById('userSidebar').classList.remove('open');
            }
            
            await renderChat();
            checkTypingStatus(userId);
            
            // 消息轮询
            if (messagePollTimers[userId]) clearInterval(messagePollTimers[userId]);
            messagePollTimers[userId] = setInterval(async () => {
                try {
                    const { data } = await sb.from('messages').select('id, from_role, content, type, status, created_at').eq('visitor_id', userId).order('created_at', {ascending: false}).limit(100);
                    if (!data || data.length === 0) return;
                    data.reverse();
                    
                    const visitorMsgs = data.filter(m => m.from_role === 'visitor' && m.status !== 'read');
                    const g = users.find(u => u.id === userId);
                    if (g) g.unread = visitorMsgs.length;
                    
                    if (currentUser?.id === userId) {
                        if (!chatKnownIds || chatKnownIds.size === 0) {
                            chatKnownIds = new Set(data.map(m => m.id));
                        } else {
                            const fresh = data.filter(m => !chatKnownIds.has(m.id));
                            if (fresh.length > 0) {
                                const container = document.getElementById('chatMessages');
                                // 批量标记已读（优化：一次请求代替多次）
                                const unreadIds = fresh.filter(m => m.from_role === 'visitor' && m.status !== 'read').map(m => m.id);
                                if (unreadIds.length > 0) {
                                    await sb.from('messages').update({status: 'read'}).in('id', unreadIds).catch(() => {});
                                }
                                for (const msg of fresh) {
                                    container.insertAdjacentHTML('beforeend', msgHtml(msg).replace('class="msg ', 'class="msg msg-new '));
                                    chatKnownIds.add(msg.id);
                                }
                                container.scrollTop = container.scrollHeight;
                            }
                        }
                    }
                    renderUserList();
                } catch(e) { console.warn('轮询消息失败:', e); }
            }, 2000);
        }

        function msgHtml(m) {
            const cls = m.from_role === 'agent' ? 'agent' : 'user';
            const pic = m.type === 'image' && m.file ? `<img src="${escapeHtml(m.file)}" alt="图片">` : '';
            const txt = m.type === 'text' && m.content ? escapeHtml(m.content).replace(/\n/g, '<br>') : '';
            return `<div class="msg ${cls}">${pic}${txt}<div class="msg-time">${formatTime(m.created_at)}</div></div>`;
        }

        async function renderChat() {
            const container = document.getElementById('chatMessages');
            if (!currentUser || !sb) { container.innerHTML = '<div class="empty-state"><div class="empty-state-icon">💬</div><div class="empty-state-text">请选择用户</div></div>'; return; }
            
            const seq = ++chatSeq;
            try {
                const { data: msgs, error } = await sb.from('messages').select('id, from_role, type, content, status, created_at').eq('visitor_id', currentUser.id).order('created_at', {ascending: false}).limit(200);
                if (seq !== chatSeq) return;
                if (error) throw error;
                
                msgs && msgs.reverse();
                chatKnownIds = new Set((msgs || []).map(m => m.id));
                
                // 标记访客消息为已读
                const unread = (msgs || []).filter(m => m.from_role === 'visitor' && m.status !== 'read').map(m => m.id);
                if (unread.length) await sb.from('messages').update({status: 'read'}).in('id', unread);
                
                container.innerHTML = (msgs || []).length
                    ? msgs.map(msgHtml).join('')
                    : '<div class="empty-state"><div class="empty-state-icon">💬</div><div class="empty-state-text">暂无消息</div></div>';
                container.scrollTop = container.scrollHeight;
            } catch(e) {
                container.innerHTML = '<div class="empty-state"><div class="empty-state-icon">⚠️</div><div class="empty-state-text">加载失败</div></div>';
            }
        }

        function checkTypingStatus(userId) {
            sb.from('typing_status').select('text, created_at').eq('visitor_id', userId).order('created_at', {ascending: false}).limit(5).then(({ data }) => {
                const now = Date.now();
                const recent = (data || []).filter(r => now - new Date(r.created_at) < 60000);
                const t = recent.map(r => r.text).find(x => x && x.trim());
                updateTypingIndicator(t ? [{text: t}] : []);
            }).catch(e => console.warn('打字状态查询失败:', e));
        }

        function updateTypingIndicator(data) {
            const indicator = document.getElementById('typingIndicator');
            if (!indicator) return;
            const t = data && data.length > 0 ? (data[0].text || '').trim() : '';
            if (t) {
                indicator.classList.add('active');
                indicator.querySelector('span:last-child').textContent = '访客正在输入: ' + escapeHtml(t);
            } else {
                indicator.classList.remove('active');
            }
        }

        function startListening() {
            if (typingCheckTimer) clearInterval(typingCheckTimer);
            typingCheckTimer = setInterval(() => {
                if (!currentUser) return;
                checkTypingStatus(currentUser.id);
            }, 2000);
        }

        function agentSend() {
            const text = document.getElementById('agentInput').value.trim();
            if (!text && !agentImage) return;
            if (!currentUser) { alert('请先选择用户'); return; }
            
            const btn = document.getElementById('agentSendBtn');
            btn.disabled = true;
            btn.textContent = '⏳';
            
            doAgentSend(text, btn);
        }

        async function doAgentSend(text, btn) {
            try {
                const msgId = 'm-' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
                const { data, error } = await sb.from('messages').insert({
                    id: msgId,
                    visitor_id: currentUser.id,
                    from_role: 'agent',
                    type: agentImage ? 'image' : 'text',
                    content: text,
                    file: agentImage,
                    status: 'sent',
                    created_at: new Date().toISOString()
                });
                
                if (error) throw error;
                
                const container = document.getElementById('chatMessages');
                container.insertAdjacentHTML('beforeend', msgHtml({id: msgId, from_role: 'agent', type: agentImage ? 'image' : 'text', content: text, file: agentImage, created_at: new Date().toISOString()}).replace('class="msg ', 'class="msg msg-new '));
                if (chatKnownIds) chatKnownIds.add(msgId);
                container.scrollTop = container.scrollHeight;
                
                // 清除客服打字状态
                try { await sb.from('typing_status').delete().eq('visitor_id', 'agent'); } catch(e) {}
                
                document.getElementById('agentInput').value = '';
                document.getElementById('agentInput').style.height = 'auto';
                removeAgentImg();
                btn.disabled = false;
                btn.textContent = '➤';
            } catch(e) {
                console.error('发送失败:', e);
                alert('发送失败，请重试');
                btn.disabled = false;
                btn.textContent = '➤';
            }
        }

        // 图片处理
        function handleAgentFile(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = async function(e) {
                agentImage = await compressImage(e.target.result, 900, 0.7);
                document.getElementById('agentPreviewImg').src = agentImage;
                document.getElementById('agentImgPreview').classList.add('active');
            };
            reader.readAsDataURL(file);
            event.target.value = '';
        }

        function removeAgentImg() {
            agentImage = null;
            document.getElementById('agentImgPreview').classList.remove('active');
            document.getElementById('agentPreviewImg').src = '';
        }

        async function compressImage(dataUrl, maxWidth, quality) {
            return new Promise((resolve) => {
                const img = new Image();
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    let w = img.width, h = img.height;
                    if (w > maxWidth) { h = h * maxWidth / w; w = maxWidth; }
                    canvas.width = w; canvas.height = h;
                    canvas.getContext('2d').drawImage(img, 0, 0, w, h);
                    resolve(canvas.toDataURL('image/jpeg', quality));
                };
                img.onerror = () => resolve(null);
                img.src = dataUrl;
            });
        }

        async function loadConfig() {
            try {
                const { data } = await sb.from('config').select('key, value').in('key', ['title', 'logo', 'admin_password']);
                if (!data) return;
                data.forEach(c => {
                    if (c.key === 'admin_password' && c.value) ADMIN_PASSWORD = c.value;
                });
            } catch(e) { console.warn('加载配置失败:', e); }
        }

        function saveSettings() {
            const name = document.getElementById('nameInput').value.trim();
            if (!name) return;
            sb.from('config').upsert({key: 'title', value: name}).then(() => alert('保存成功')).catch(e => alert('保存失败: ' + e.message));
        }

        function saveLogo() {
            if (!agentImage) { alert('请先选择图片'); return; }
            sb.from('config').upsert({key: 'logo', value: agentImage}).then(() => alert('保存成功')).catch(e => alert('保存失败: ' + e.message));
        }

        function handleLogo(event) {
            const file = event.target.files[0];
            if (!file) return;
            
            // 类型校验
            const allowedTypes = ['image/jpeg', 'image/png', 'image/webp', 'image/gif'];
            if (!allowedTypes.includes(file.type)) {
                alert('只支持 JPG/PNG/WEBP/GIF 格式');
                event.target.value = '';
                return;
            }
            
            // 大小校验（最大1MB）
            if (file.size > 1 * 1024 * 1024) {
                alert('图片大小不能超过1MB');
                event.target.value = '';
                return;
            }
            
            const reader = new FileReader();
            reader.onload = async function(e) {
                agentImage = await compressImage(e.target.result, 300, 0.85);
                document.getElementById('logoPreview').innerHTML = `<img src="${agentImage}" style="width:100%;height:100%;object-fit:cover;border-radius:12px;">`;
            };
            reader.readAsDataURL(file);
        }

        // 工具函数
        function escapeHtml(str) {
            if (!str) return '';
            const map = {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'};
            return String(str).replace(/[&<>"']/g, m => map[m]);
        }

        function formatTime(iso) {
            if (!iso) return '';
            const d = new Date(iso);
            return d.toLocaleTimeString('zh-CN', {hour: '2-digit', minute: '2-digit'});
        }

        function formatTimeShort(ts) {
            if (!ts) return '';
            const d = new Date(ts);
            return d.toLocaleTimeString('zh-CN', {hour: '2-digit', minute: '2-digit'});
        }

        function closeSidebar() {
            document.getElementById('userSidebar').classList.remove('open');
        }

        function jumpToUser() {
            document.getElementById('newMsgBanner').classList.remove('show');
        }

        // 事件监听
        document.getElementById('agentInput').addEventListener('input', function() {
            this.style.height = 'auto';
            this.style.height = Math.min(this.scrollHeight, 150) + 'px';
            document.getElementById('agentSendBtn').disabled = !this.value.trim() && !agentImage;
            
            // 上报打字状态
            const val = this.value.trim();
            if (!sb) return;
            clearTimeout(this._typingTimer);
            if (!val) {
                sb.from('typing_status').delete().eq('visitor_id', 'agent').catch(() => {});
                return;
            }
            this._typingTimer = setTimeout(() => {
                sb.from('typing_status').upsert({visitor_id: 'agent', text: val}).catch(() => {});
            }, 300);
        });

        document.getElementById('agentInput').addEventListener('keydown', function(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                agentSend();
            }
        });

        // 登录回车
        document.getElementById('passwordInput').addEventListener('keydown', function(e) {
            if (e.key === 'Enter') checkPassword();
        });

        // 初始化 - 直接调用，不等待load事件
        if (sessionStorage.getItem('adminAuthenticated')) {
            initApp();
        }
    </script>
</body>
</html>
